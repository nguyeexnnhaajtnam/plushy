<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plush Creatures</title>
<meta name="description" content="Species-driven soft-body plush creature simulator (WebGPU).">
<style>
:root {
  --bg: #d7d1c7;
  --bg-deep: #cbc4b8;
  --card: #e6e1d8;
  --card-2: #ece8e0;
  --ink: #221f1b;
  --ink-2: #4b453d;
  --muted: #7a7266;
  --line: rgba(34, 31, 27, 0.14);
  --line-2: rgba(34, 31, 27, 0.08);
  --accent: #8a5a33;
  --accent-ink: #fbf7f0;
  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Apple Garamond", Georgia, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --radius: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
.page { max-width: 1480px; margin: 0 auto; padding: 22px 28px 40px; }

/* masthead */
.masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.brand { font: 600 13px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; }
.brand em { font: italic 400 15px/1 var(--serif); letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 8px; }
.masthead .meta { font: 12px/1 var(--mono); color: var(--muted); }

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 348px; gap: 28px; margin-top: 22px; align-items: start; }
.stage { min-width: 0; }
.title-block { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 8px 36px; align-items: end; margin-bottom: 18px; }
.kicker { grid-column: 1 / -1; margin: 0; font: 600 11.5px/1 var(--sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-family: var(--serif); font-weight: 400; line-height: 0.86; letter-spacing: -0.02em; }
h1 .l1 { display: block; font-style: italic; font-size: clamp(30px, 3.6vw, 52px); color: var(--ink-2); margin-left: 0.08em; }
h1 .l2 { display: block; font-size: clamp(54px, 7.6vw, 116px); }
.lede { margin: 0 0 6px; max-width: 46ch; font: 17px/1.45 var(--serif); color: var(--ink-2); }

/* viewport */
.viewport { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--bg-deep);
  aspect-ratio: 16 / 9.4; min-height: 380px; box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 0 rgba(255,255,255,0.35); }
.viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
.viewport canvas.on-creature { cursor: pointer; }
.viewport canvas.dragging { cursor: grabbing; }
.tools { position: absolute; left: 14px; top: 14px; display: flex; gap: 4px; padding: 4px; border-radius: 999px;
  background: rgba(236, 232, 224, 0.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.tool { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 11px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.tool .g { font-size: 15px; width: 16px; text-align: center; }
.tool:hover { background: rgba(34,31,27,0.06); }
.tool[aria-checked="true"] { background: var(--ink); color: var(--card-2); }
.tool:focus-visible, .btn:focus-visible, .switch:focus-visible, .swatch:focus-visible, .species-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { position: absolute; right: 14px; top: 14px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px;
  border-radius: 999px; background: rgba(236, 232, 224, 0.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13px; color: var(--ink-2); }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.status.paused .dot { background: var(--muted); box-shadow: none; }
.hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: calc(100% - 28px); padding: 7px 14px; border-radius: 999px;
  background: rgba(34, 31, 27, 0.72); color: #f3efe8; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; transition: opacity .25s; }
.hint:empty { opacity: 0; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(215, 209, 199, 0.72); font: italic 22px/1.3 var(--serif); color: var(--ink-2); transition: opacity .3s; }
.overlay[hidden] { display: grid; opacity: 0; pointer-events: none; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 28px; background: var(--card); }
.fallback[hidden] { display: none; }
.fallback .box { max-width: 520px; }
.fallback h3 { margin: 0 0 8px; font: 400 28px/1.15 var(--serif); }
.fallback p { margin: 0 0 10px; color: var(--ink-2); }
.fallback code { font: 12.5px var(--mono); background: rgba(34,31,27,0.06); padding: 2px 6px; border-radius: 6px; }

/* readouts */
.readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 0; margin: 16px 0 0; border-top: 1px solid var(--line); }
.readout { padding: 12px 16px 2px 0; }
.readout + .readout { padding-left: 16px; border-left: 1px solid var(--line-2); }
.readout dt { font: 600 10.5px/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.readout dd { margin: 8px 0 0; font: 400 32px/1 var(--serif); font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.readout dd small { font: 13px var(--sans); color: var(--muted); margin-left: 4px; }
.readout.wide dd { font-size: 20px; line-height: 1.25; white-space: normal; }
.engine-line { margin: 12px 0 0; font: 11.5px/1.5 var(--mono); color: var(--muted); }

/* panel */
.panel { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 32px); overflow: auto; padding-bottom: 4px; scrollbar-width: thin; }
.block { background: var(--card); border-radius: var(--radius); padding: 16px 16px 14px; box-shadow: inset 0 0 0 1px var(--line-2); }
.block h2 { margin: 0 0 12px; font: 600 11px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.block h2 span { letter-spacing: 0.04em; text-transform: none; font-weight: 400; }
.group + .group { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line-2); }
.group-label { font: 600 11px/1 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; }

.species-list { display: grid; gap: 6px; }
.species-opt { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; width: 100%; padding: 10px 12px; text-align: left; border: 0; border-radius: 10px;
  background: var(--card-2); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line-2); }
.species-opt:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--line); }
.species-opt[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--ink); background: #f4f1eb; }
.species-opt:disabled { cursor: not-allowed; opacity: 0.55; background: transparent; }
.species-opt .nm { font: 400 17px/1.2 var(--serif); }
.species-opt .ct { grid-column: 1; font-size: 12px; color: var(--muted); }
.species-opt .chip { grid-row: 1 / span 2; grid-column: 2; font: 600 10px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: rgba(34,31,27,0.07); color: var(--ink-2); }
.species-opt .chip.complete { background: var(--ink); color: var(--card-2); }

.btn-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.btn { min-height: 38px; padding: 6px 10px; border: 0; border-radius: 10px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; font-size: 13.5px; font-weight: 500; }
.btn:hover:not(:disabled) { background: #f5f2ec; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, black); }
.btn.wide { grid-column: span 3; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.flash { animation: flash .35s; }
@keyframes flash { from { box-shadow: inset 0 0 0 2px var(--accent); } }

.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.toggle-row + .toggle-row { border-top: 1px solid var(--line-2); }
.toggle-row .lbl { font-size: 14px; }
.toggle-row .sub { display: block; font-size: 12px; color: var(--muted); }
.switch { position: relative; flex: none; width: 42px; height: 24px; border: 0; border-radius: 999px; background: rgba(34,31,27,0.18); cursor: pointer; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }

.slider + .slider { margin-top: 12px; }
.slider .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.slider label { font-size: 14px; }
.slider output { font: 12.5px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--ink) var(--p, 50%), rgba(34,31,27,0.18) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(34,31,27,0.18); }
input[type=range]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--ink); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7.5px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); }
input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.swatch { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 6px 8px; border: 0; border-radius: 10px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line-2); cursor: pointer; font-size: 12.5px; }
.swatch .chip { width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
.swatch[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--ink); background: #f4f1eb; }
select.sel { width: 100%; height: 36px; border-radius: 10px; border: 0; padding: 0 10px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); }

/* notes */
.notes { background: var(--card); border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line-2); }
.notes > summary { list-style: none; cursor: pointer; padding: 15px 16px; font: 600 11px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.notes > summary::-webkit-details-marker { display: none; }
.notes > summary::after { content: "+"; font: 400 16px/0.7 var(--sans); }
.notes[open] > summary::after { content: "–"; }
.notes-body { padding: 0 16px 16px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.notes-body h3 { margin: 14px 0 6px; font: 600 11px/1 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); }
.notes-body h3:first-child { margin-top: 0; }
.notes-body ul { margin: 0; padding-left: 16px; }
.notes-body li + li { margin-top: 4px; }
.notes-body .tag { display: inline-block; font: 600 9.5px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
.tag.ok { background: #d8e4d0; color: #2f4a25; }
.tag.approx { background: #efdcc4; color: #6b4316; }
.tag.limit { background: #e6d3d3; color: #6b2a2a; }
.notes-body .kv { font: 12px var(--mono); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 1080px) {
  .layout { grid-template-columns: minmax(0, 1fr) 312px; gap: 20px; }
  .title-block { grid-template-columns: 1fr; }
  .lede { max-width: 60ch; }
}
@media (max-width: 860px) {
  .page { padding: 14px 16px 32px; }
  .masthead .meta { display: none; }
  .layout { grid-template-columns: 1fr; gap: 16px; margin-top: 14px; }
  .panel { position: static; max-height: none; overflow: visible; }
  .title-block { margin-bottom: 12px; }
  h1 .l2 { font-size: clamp(46px, 14vw, 84px); }
  .lede { font-size: 15.5px; }
  .viewport { aspect-ratio: auto; height: min(64vh, 560px); min-height: 340px; margin: 0 -16px; border-radius: 0; }
  .tools { left: 50%; top: auto; bottom: 12px; transform: translateX(-50%); }
  .tool { height: 42px; padding: 0 16px 0 13px; font-size: 14px; }
  .hint { bottom: 66px; }
  .status { top: 12px; right: 12px; }
  .readouts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .readout:nth-child(odd) { padding-left: 0; border-left: 0; }
  .readout { border-bottom: 1px solid var(--line-2); padding-bottom: 10px; }
  .readout dd { font-size: 26px; }
  .btn { min-height: 44px; }
  .switch { width: 48px; height: 28px; }
  .switch::after { width: 22px; height: 22px; }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="brand">Plush Creatures<em>a soft-body studio</em></div>
    <div class="meta" id="meta">WebGPU · XPBD</div>
  </header>
  <main class="layout">
    <section class="stage" aria-label="Simulation">
      <div class="title-block">
        <p class="kicker" id="kicker"></p>
        <h1 id="title"><span class="l1"></span><span class="l2"></span></h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="viewport" id="viewport">
        <canvas id="gpu" tabindex="0" aria-label="Interactive plush simulation viewport"></canvas>
        <div class="tools" id="tools" role="radiogroup" aria-label="Interaction tool"></div>
        <div class="status" id="status" aria-live="polite"><span class="dot"></span><span id="stateLabel">Starting…</span></div>
        <div class="hint" id="hint"></div>
        <div class="overlay" id="overlay">Sewing…</div>
        <div class="fallback" id="fallback" hidden></div>
      </div>
      <dl class="readouts" id="readouts"></dl>
      <p class="engine-line" id="engineLine"></p>
    </section>
    <aside class="panel" id="panel" aria-label="Controls">
      <section class="block"><h2>Species</h2><div class="species-list" id="speciesList" role="radiogroup" aria-label="Species"></div></section>
      <section class="block" id="speciesBlock"><h2>Controls <span id="speciesName"></span></h2><div id="speciesControls"></div></section>
      <section class="block"><h2>Simulation <span>global</span></h2><div id="globalControls"></div></section>
      <details class="notes" id="notes"><summary>Technical notes</summary><div class="notes-body" id="notesBody"></div></details>
    </aside>
  </main>
</div>
