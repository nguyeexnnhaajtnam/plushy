  const hammer = (x, y, z) => {
    const az = Math.abs(z), zn = z / 0.55;
    const xf = 0.8 - 0.16 * zn * zn - 0.035 * Math.exp(-((z / 0.07) ** 2));
    const xb = 0.53 - 0.13 * zn * zn;
    let d2 = SDF.smax(x - xf, xb - x, 0.06);
    d2 = SDF.smax(d2, az - W, 0.1);
    const h = 0.062 - 0.018 * Math.min(az / W, 1);
    const d = SDF.extrude(d2, y - hammerMid(z), h, h * 0.9);
    return SDF.smin(d, SDF.ellipsoid(x, y, az, 0.585, 0.02, 0.5, 0.11, 0.07, 0.085), 0.06);
  };
  const eye = (x, y, z) => SDF.sphere(x, y, Math.abs(z), 0.588, 0.034, 0.6, 0.05);
  const dorsal = (x, y, z) => SDF.planar(x, y, z, fDorsal, DORSAL, 0.045, 0.04, 0.09);
  const caudal = (x, y, z) => SDF.planar(x, y, z, fDorsal, CAUDAL, 0.04, 0.035, 0.08);
  const pect = (x, y, z) => SDF.planar(x, y, z, z > 0 ? fPectR : fPectL, PECT, 0.032, 0.028, 0.08);
  const cavity = (x, y, z) => SDF.ellipsoid(x, y, z, 0.54, -0.085, 0, 0.065, 0.045, 0.14);
  const body = (x, y, z) => {
    let d = SDF.smin(torso(x, y, z), hammer(x, y, z), 0.12);
    d = SDF.smin(d, dorsal(x, y, z), 0.07);
    d = SDF.smin(d, caudal(x, y, z), 0.06);
    d = SDF.smin(d, pect(x, y, z), 0.06);
    d = SDF.smax(d, -cavity(x, y, z), 0.025);
    return Math.min(d, eye(x, y, z));
  };
  const finField = (x, y, z) => Math.min(torso(x, y, z), hammer(x, y, z)) - 0.004 - Math.min(dorsal(x, y, z), caudal(x, y, z), pect(x, y, z));
  const isFin = (x, y, z) => finField(x, y, z) > 0;
  const seamY = (x, z) => lerp(lerp(-0.02, -0.05, smoothstep(-0.9, 0.0, x)), hammerMid(z), smoothstep(0.42, 0.56, x));
  // Lower jaw: a smiling lip arc with felt teeth; upper teeth hang from the palate.
  const arc = (t) => [0.565 - 0.05 * t * t, -0.112 + 0.03 * t * t, 0.12 * t];
  const arcU = (t) => [0.57 - 0.05 * t * t, -0.058 + 0.025 * t * t, 0.115 * t];
  const LOWER_T = [-0.8, -0.53, -0.27, 0, 0.27, 0.53, 0.8], UPPER_T = [-0.67, -0.4, -0.13, 0.13, 0.4, 0.67];
  const lip = (x, y, z) => {
    let d = Infinity;
    for (let i = 0; i < 6; i++) d = Math.min(d, SDF.cone(x, y, z, arc(-1 + i / 3), arc(-1 + (i + 1) / 3), 0.026, 0.026));
    return SDF.smin(d, SDF.ellipsoid(x, y, z, 0.5, -0.128, 0, 0.075, 0.03, 0.11), 0.03);
  };
  const lowerTeeth = (x, y, z) => {
    let d = Infinity;
    for (const t of LOWER_T) { const b = v3.add(arc(t), [0, 0.016, 0]); d = Math.min(d, SDF.cone(x, y, z, b, v3.add(b, [0.004, 0.03, 0]), 0.012, 0.002)); }
    return d;
  };
  const upperTeeth = (x, y, z) => {
    let d = Infinity;
    for (const t of UPPER_T) { const b = arcU(t); d = Math.min(d, SDF.cone(x, y, z, b, v3.add(b, [0.004, -0.028, 0]), 0.011, 0.002)); }
    return d;
  };
  const jaw = (x, y, z) => Math.min(lip(x, y, z), lowerTeeth(x, y, z));

  const finFlow = (x, y, z) => {
    const dT = Math.min(torso(x, y, z), hammer(x, y, z)), dD = dorsal(x, y, z), dC = caudal(x, y, z), dP = pect(x, y, z);
    const m = Math.min(dD, dC, dP);
    if (m > dT) return [-1, 0, 0];
    if (m === dD) return [-0.55, 1, 0];
    if (m === dC) return [-1, 0.35 * Math.sign(y - 0.05), 0];
    return [-0.4, -0.35, Math.sign(z)];
  };

  return {
    id: 'hammerhead', name: 'Plush Hammerhead', category: 'Cartilaginous fish', status: 'complete',
    description: 'Minky hammerhead with a felt-lined smile, articulated jaw and glass eyes on its cephalofoil.',
    display: {
      kicker: 'No. 01 — Sphyrnidae', title: ['Plush', 'Hammerhead'], theme: { accent: '#8a5a33' },
      description: 'A minky hammerhead with a sewn cream belly, a felt-lined smile and glass eyes on the tips of its hammer. ' +
        'It swims on a travelling S-wave, sweeps the floor for felt fish, and wriggles and blushes when you boop the middle of its head.',
    },
    environment: { preset: 'tank', spawn: { pos: [0.2, 1.2, 0.3], yaw: 0.4 }, camera: { target: [0, 0.85, 0], distance: 6.2, yaw: 0.62, pitch: 0.32, follow: 0.55 } },
    createState: () => ({ fishEaten: 0 }),

    anatomy: {
      physicsSdf: body,
      parts: [
        { id: 'body', sdf: body, resolution: 0.0165, bounds: { min: [-1.44, -0.29, -0.7], max: [0.86, 0.7, 0.7] },
          region(x, y, z) {
            if (eye(x, y, z) < 0.006) return 'eye';
            if (cavity(x, y, z) < 0.006) return 'mouth';
            if (isFin(x, y, z)) return 'fin';
            return y < seamY(x, z) ? 'belly' : 'body';
          },
          // Signed fields resolved per fragment so the belly seam and the lip line stay crisp.
          boundaries: [
            { field: (x, y, z) => finField(x, y, z), positive: 'fin', negative: (x, y, z) => (y < seamY(x, z) ? 'belly' : 'body'), band: 0.04 },
            { field: (x, y, z) => cavity(x, y, z) - 0.006, negative: 'mouth', positive: (x, y, z) => (y < seamY(x, z) ? 'belly' : 'body'), band: 0.05 },
            { field: (x, y, z) => y - seamY(x, z), positive: 'body', negative: 'belly', band: 0.05, where: (x, y, z) => !isFin(x, y, z) && eye(x, y, z) > 0.006 },
          ] },
        { id: 'jaw', sdf: jaw, resolution: 0.0055, bounds: { min: [0.38, -0.18, -0.17], max: [0.64, -0.03, 0.17] },
          attach: { anchor: 'hinge', joint: 'jaw' }, fur: false,
          region(x, y, z) {
            if (lowerTeeth(x, y, z) < 0.003) return 'tooth';
            const a = arc(clamp(z / 0.12, -1, 1));
            return y > a[1] + 0.006 && x > 0.47 ? 'mouth' : 'belly';
          } },
        { id: 'upperTeeth', sdf: upperTeeth, resolution: 0.005, bounds: { min: [0.49, -0.1, -0.11], max: [0.6, -0.02, 0.11] },
          attach: { anchor: 'hinge' }, fur: false, region: () => 'tooth' },
      ],
      anchors: { hinge: [0.44, -0.095, 0] },
      joints: { jaw: { axis: [0, 0, 1], min: 0, max: -0.52, stiffness: 320, damping: 22 } },
      landmarks: { mouth: [0.56, -0.09, 0], head: [0.64, 0.03, 0], tail: [-1.0, 0.05, 0] },
      expressions: { channels: ['blush'], spots: [
        { center: [0.69, 0.09, 0.17], radius: 0.085, color: '#f07c93', channel: 'blush' },
        { center: [0.69, 0.09, -0.17], radius: 0.085, color: '#f07c93', channel: 'blush' }] },
      decals({ surfacePoint, sdf }) {
        const out = [];
        for (const side of [1, -1]) {
          const S = side > 0 ? 'R' : 'L';
          for (let i = 0; i < 5; i++) {
            const xg = 0.31 - i * 0.045, pts = [];
            for (const yy of [0.085, 0.03, -0.025, -0.07]) { const p = surfacePoint(sdf, [xg + 0.02 * (yy / 0.07) - 0.006 * (yy / 0.07) ** 2, yy, 0], [0, 0, side], 0.6, 0.004); if (p) pts.push(p); }
            if (pts.length > 1) out.push({ group: 'gills' + S, region: 'gill', width: 0.0095, points: pts });
          }
          for (const [g, a, b] of [['seamF' + S, -0.2, 0.42], ['seamB' + S, -0.88, -0.2]]) {
            const pts = [];
            for (let k = 0; k <= 9; k++) {
              const x = lerp(a, b, k / 9), p = surfacePoint(sdf, [x, seamY(x, 0), 0], [0, 0, side], 0.6, 0.004);
              if (p) pts.push(p);
            }
            out.push({ group: g, region: 'seam', width: 0.0055, points: pts, dash: { period: 0.024, duty: 0.58 } });
          }
        }
        for (const [g, a, b] of [['rimL', -0.5, 0], ['rimR', 0, 0.5]]) {
          const pts = [];
          for (let k = 0; k <= 11; k++) {
            const z = lerp(a, b, k / 11), p = surfacePoint(sdf, [0.6, hammerMid(z), z], [1, 0, 0], 0.4, 0.003);
            if (p) pts.push(p);
          }
          out.push({ group: g, region: 'seam', width: 0.0048, points: pts, dash: { period: 0.024, duty: 0.58 } });
        }
        return out;
      },
    },

    physics: {
      latticeSpacing: 0.08, substeps: 8,
      shapeStiffness: [0.05, 0.42], volumeCompliance: [6e-8, 6e-10], inflate: [0.93, 1.07], grabCompliance: 0.006,
      unitMeters: 0.35, fillGramsPerLitre: 28, shellGrams: 140,
      stuffingAt(x, y, z) {
        const dB = Math.min(torso(x, y, z), hammer(x, y, z)), dF = Math.min(dorsal(x, y, z), caudal(x, y, z), pect(x, y, z));
        if (dF < dB) return { density: 0.45, stiffness: 0.5 };      // fins: lightly stuffed, floppier
        if (x > 0.45) return { density: 1.25, stiffness: 1.5 };     // packed head keeps the hammer flat
        if (x < -0.75) return { density: 0.7, stiffness: 0.75 };
        return { density: 1, stiffness: 1 };
      },
    },

        { id: 'lagoon', label: 'Lagoon', colors: { body: '#3f7c86', belly: '#eee6d1', fin: '#336771', eye: '#101618', mouth: '#ad4858', tooth: '#fbf6ea', gill: '#1f4249', seam: '#2b545b' } },
        { id: 'sunset', label: 'Sunset', colors: { body: '#df7a53', belly: '#f7e5c9', fin: '#c95f3e', eye: '#1c110d', mouth: '#9b3646', tooth: '#fbf6ea', gill: '#7a321f', seam: '#8d4128' } },

    behaviors: {
      initial: 'cruise',
      states: {
        cruise: {
          kind: 'autonomous', priority: 0, resumable: true, label: 'Cruising',
          enter(ctx, d) { d.scanAt = ctx.time + 10 + ctx.rand() * 8; d.wp = null; },
          resume(ctx, d) { d.scanAt = Math.max(d.scanAt, ctx.time + 6); d.wp = null; },
          update(ctx, d) {
            const I = ctx.intent, b = ctx.body, E = ctx.env;
            if (ctx.flags.circle) {
              const c = E.center, a = Math.atan2(b.c[2] - c[2], b.c[0] - c[0]) - 0.75;
              I.target = [c[0] + 1.75 * Math.cos(a), 1.15 + 0.3 * Math.sin(ctx.time * 0.27), c[2] + 1.45 * Math.sin(a)];
            } else {
              if (!d.wp || v3.dist(d.wp, b.c) < 0.8) d.wp = E.randomPoint(1.1, [0.25, 0.7]);
              I.target = d.wp;

            I.speed = 0.55;
            if (ctx.time > d.scanAt) return { next: 'scan' };

        },
        scan: {
          kind: 'autonomous', priority: 2, duration: 6, label: 'Scanning the floor',
          update(ctx, d, dt, t) {
            const I = ctx.intent, b = ctx.body, f = v3.norm([b.f[0], 0, b.f[2]]);
            I.target = [b.c[0] + f[0] * 1.6 - f[2] * 0.4 * Math.sin(t * 0.5), ctx.env.floorY + 0.3, b.c[2] + f[2] * 1.6 + f[0] * 0.4 * Math.sin(t * 0.5)];
            I.headYaw = 0.5 * Math.sin(t * 2.6) * smoothstep(0, 0.8, t);
            I.speed = 0.35; I.beat = 0.85;

        hunt: {
          kind: 'environment', priority: 5, label: 'Hunting a felt fish',
          trigger: (ctx) => !!ctx.env.nearest('feltFish', ctx.body.c),
          update(ctx, d, dt, t) {
            const I = ctx.intent, fish = ctx.env.nearest('feltFish', ctx.body.c);

            const mouth = ctx.landmark('mouth'), dist = v3.dist(mouth, fish.pos);
            I.target = [fish.pos[0], fish.pos[1] + 0.13, fish.pos[2]];
            if (dist > 1.3) { I.speed = 0.75; I.beat = 1.2; I.headYaw = 0.35 * Math.sin(t * 3.2); }
            else { I.speed = 1.05; I.beat = 1.9; I.joints.jaw = clamp((1.1 - dist) / 0.55, 0, 1); }
            if (dist < 0.34) ctx.env.attract(fish, mouth, 5, dt);
            if (dist < 0.12) { ctx.env.consume(fish, mouth); ctx.state.fishEaten++; return { next: 'chomp' }; }

          update(ctx, d) { const I = ctx.intent; I.target = d.target; I.speed = 2.4; I.beat = 2.7; I.amplitude = 1.2; },

        'Hunting is environment-triggered by a felt fish in the tank: the shark approaches while scanning, speeds up, opens its jaw, then pulls the fish in by suction and eats it.',
        'When you grab it by the tail it thrashes (beat ×3.2), then bolts away once you let go. A boop on the centre of the hammer makes it wriggle and blush.',
        'Gills, the belly seam and the hammer rim are drawn as embroidery and stitch decals that flatten the pile under them.',
      ],
      approximations: [
        'There is no fluid simulation. Thrust comes partly from anisotropic drag on the undulating lattice and partly from a propulsive force along the body axis, scaled by beat frequency.',
        'The jaw is a 1-DoF damped joint, rigidly skinned to the lattice frame at its hinge. It is not part of the soft lattice.',
        'Suction feeding pulls the fish toward the mouth kinematically once it is within 0.34 units.',
      ],
    },
  };
})();

/* ---------------------------------------------------------------------- */
/* 2. DUST BUNNY — minimal second species (validation fixture)            */
/*    Different anatomy (ears, no fins, no jaw), a different locomotion    */
/*    capability (hop under gravity), different environment, behaviours,  */
/*    reactions and controls — with zero engine changes.                  */
/* ---------------------------------------------------------------------- */
const DustBunny = (() => {
  const { SDF } = Engine, { smoothstep, v3 } = Engine.math;
  const EAR = [0.06, 0, 0.068, 0.17, 0.045, 0.33, 0, 0.38, -0.045, 0.33, -0.068, 0.17, -0.06, 0];
  const fEarR = SDF.frame([0.2, 0.56, 0.075], [0, 0, 1], [-0.3, 1, 0.22]);
  const fEarL = SDF.frame([0.2, 0.56, -0.075], [0, 0, -1], [-0.3, 1, -0.22]);
  const core = (x, y, z) => {
    const az = Math.abs(z);
    let d = SDF.ellipsoid(x, y, z, -0.04, 0.27, 0, 0.34, 0.26, 0.27);
    d = SDF.smin(d, SDF.ellipsoid(x, y, az, -0.14, 0.2, 0.13, 0.2, 0.17, 0.12), 0.08);
    d = SDF.smin(d, SDF.ellipsoid(x, y, z, 0.27, 0.47, 0, 0.19, 0.17, 0.18), 0.1);
    d = SDF.smin(d, SDF.ellipsoid(x, y, az, 0.33, 0.42, 0.08, 0.1, 0.08, 0.08), 0.05);
    d = SDF.smin(d, SDF.ellipsoid(x, y, az, 0.13, 0.05, 0.11, 0.13, 0.05, 0.065), 0.06);
    return SDF.smin(d, SDF.ellipsoid(x, y, az, -0.13, 0.045, 0.17, 0.18, 0.045, 0.07), 0.06);
  };
  const ears = (x, y, z) => SDF.planar(x, y, z, z > 0 ? fEarR : fEarL, EAR, 0.024, 0.021, 0.04);
  const puff = (x, y, z) => SDF.sphere(x, y, z, -0.38, 0.28, 0, 0.085);
  const eye = (x, y, z) => SDF.sphere(x, y, Math.abs(z), 0.385, 0.5, 0.105, 0.031);
  const body = (x, y, z) => Math.min(SDF.smin(SDF.smin(core(x, y, z), ears(x, y, z), 0.05), puff(x, y, z), 0.04), eye(x, y, z));
  const earLocal = (x, y, z) => {
    const F = z > 0 ? fEarR : fEarL, dx = x - F.o[0], dy = y - F.o[1], dz = z - F.o[2];
    return [dx * F.u[0] + dy * F.u[1] + dz * F.u[2], dx * F.v[0] + dy * F.v[1] + dz * F.v[2]];
  };

  return {
    id: 'dust-bunny', name: 'Dust Bunny', category: 'Lagomorph', status: 'prototype',
    description: 'Minimal second species that proves the engine is not shark-shaped.',
    display: {
      kicker: 'Prototype — validation fixture', title: ['Dust', 'Bunny'], theme: { accent: '#7d6a8c' },
      description: 'A deliberately small second species: floppy lattice ears, a hop-based locomotion capability under gravity, ' +
        'and its own reactions — built from a definition alone, with no changes to the engine.',
    },
    environment: { preset: 'studio', spawn: { pos: [0, 0.31, 0], yaw: 0.6 }, camera: { target: [0, 0.4, 0], distance: 4.6, yaw: 0.7, pitch: 0.36, follow: 0.7 } },
    createState: () => ({}),
    anatomy: {
      physicsSdf: body,
      parts: [{ id: 'body', sdf: body, resolution: 0.0135, bounds: { min: [-0.5, -0.02, -0.32], max: [0.52, 0.98, 0.32] },
        region(x, y, z) {
          if (eye(x, y, z) < 0.005) return 'eye';
          if (puff(x, y, z) < core(x, y, z) - 0.005) return 'puff';
          if (ears(x, y, z) < core(x, y, z) - 0.01) {
            const [u, v] = earLocal(x, y, z);
            return x > (z > 0 ? fEarR : fEarL).o[0] - 0.3 * v * 0.29 && Math.abs(u) < 0.04 && v > 0.04 && v < 0.33 ? 'earInner' : 'body';
          }
          return y < 0.3 && x > 0.05 && Math.abs(z) < 0.16 ? 'belly' : 'body';
        } }],
      anchors: {}, joints: {},
      landmarks: { nose: [0.45, 0.45, 0] },
      expressions: { channels: ['content'], spots: [
        { center: [0.37, 0.42, 0.13], radius: 0.06, color: '#f2a1a8', channel: 'content' },
        { center: [0.37, 0.42, -0.13], radius: 0.06, color: '#f2a1a8', channel: 'content' }] },
      decals({ surfacePoint, sdf }) {
        const tip = surfacePoint(sdf, [0.25, 0.445, 0], [1, 0, 0], 0.4, 0.003);
        const ys = surfacePoint(sdf, [0.25, 0.405, 0], [1, 0, 0], 0.4, 0.003);
        const l = surfacePoint(sdf, [0.25, 0.385, 0.03], [1, 0, 0.25], 0.4, 0.003), r = surfacePoint(sdf, [0.25, 0.385, -0.03], [1, 0, -0.25], 0.4, 0.003);
        return [
          { group: 'nose', region: 'nose', width: 0.011, points: [tip, ys] },
          { group: 'nose', region: 'nose', width: 0.005, points: [ys, l] },
          { group: 'nose', region: 'nose', width: 0.005, points: [ys, r] },

      },
    },
    physics: {
      latticeSpacing: 0.058, substeps: 8,
      shapeStiffness: [0.06, 0.45], volumeCompliance: [8e-8, 8e-10], inflate: [0.94, 1.06], grabCompliance: 0.005,
      unitMeters: 0.25, fillGramsPerLitre: 30, shellGrams: 45,
      stuffingAt(x, y, z) {
        if (ears(x, y, z) < core(x, y, z)) return { density: 0.35, stiffness: 0.22 + 0.5 * smoothstep(0.85, 0.6, y) };
        if (puff(x, y, z) < core(x, y, z)) return { density: 0.5, stiffness: 0.5 };
        return { density: 1, stiffness: 1 };
      },
    },
    locomotion: {
      type: 'hop', groundY: 0, headX: 0.2, squash: 0.2, stretch: 0.12, crouchTime: 0.17, hopHeight: 0.3, hopDistance: 0.6,

      direction(x, y, z) {

    },
    materials: {
      regions: { body: { type: 'plush' }, belly: { type: 'plush', fur: 0.85 }, puff: { type: 'plush', fur: 1.7 },
        earInner: { type: 'felt' }, eye: { type: 'glass' }, nose: { type: 'embroidery' } },
      defaultPreset: 'oat',
      presets: [

        { id: 'cocoa', label: 'Cocoa', colors: { body: '#7b5741', belly: '#c8a98b', puff: '#eadccb', earInner: '#d99592', eye: '#140e0b', nose: '#4e2c28' } },
        { id: 'snow', label: 'Snow', colors: { body: '#efebe4', belly: '#f8f6f1', puff: '#ffffff', earInner: '#f1b6b8', eye: '#22140f', nose: '#c46d79' } },
      ],
    },
    behaviors: {
      initial: 'sit',
      states: {
        sit: {
          kind: 'autonomous', priority: 0, resumable: true, label: 'Sitting',
          enter(ctx, d) { d.until = ctx.time + 1.5 + ctx.rand() * 2.5; },
          resume(ctx, d) { d.until = ctx.time + 1 + ctx.rand() * 2; },
          update(ctx, d) { ctx.intent.sniff = 0.3; if (ctx.flags.wander && ctx.time > d.until) return { next: ctx.rand() < 0.35 ? 'sniff' : 'hopAbout' }; },
        },
        hopAbout: {
          kind: 'autonomous', priority: 1, label: 'Hopping about',
          enter(ctx, d) { d.target = ctx.env.randomPoint(0.8, [0.1, 0.1]); },
          update(ctx, d, dt, t) {
            const c = ctx.body.c; ctx.intent.target = d.target; ctx.intent.hop = true;
            if (Math.hypot(c[0] - d.target[0], c[2] - d.target[2]) < 0.35 || t > 7) return 'done';
          },
        },
        sniff: { kind: 'autonomous', priority: 2, duration: 2.4, label: 'Sniffing', update(ctx) { ctx.intent.sniff = 1; ctx.intent.crouch = 0.2; } },
        hop: {
          kind: 'user', priority: 5, label: 'Hop',
          enter(ctx, d) { const b = ctx.body; d.target = [b.c[0] + b.f[0] * 0.7, 0, b.c[2] + b.f[2] * 0.7]; },
          update(ctx, d, dt, t) {
            if (ctx.locomotion.airborne) d.launched = true;
            ctx.intent.target = d.target; ctx.intent.hopNow = !d.launched;

          },
        },
        binky: {
          kind: 'user', priority: 6, label: 'Binky!',
          update(ctx, d, dt, t) {
            const I = ctx.intent;
            if (ctx.locomotion.airborne) d.launched = true;
            I.hopNow = !d.launched; I.hopScale = 1.7; I.twist = 1; I.expr.content = 0.6; I.turn = false;
            if ((d.launched && !ctx.locomotion.airborne) || t > 2.5) return 'done';
          },
        },
        startle: {
          kind: 'reactive', priority: 7, label: 'Startled',
          enter(ctx, d, info) {
            const c = ctx.body.c, p = info?.point || c, a = v3.norm([c[0] - p[0] + 1e-3, 0, c[2] - p[2]]);
            d.target = [c[0] + a[0] * 1.2, 0, c[2] + a[2] * 1.2];
          },
          update(ctx, d, dt, t) {
            if (ctx.locomotion.airborne) d.launched = true;

          kind: 'reactive', priority: 3, label: 'Melting into the brush',
          enter(ctx, d) { d.until = ctx.time + 2.2; }, retrigger(ctx, d) { d.until = ctx.time + 2.2; },

      tools: ['hand', 'finger', 'comb'], pickRadius: 0.03,

        { id: 'ears', label: 'Ears', test: (x, y) => y > 0.62 },
        { id: 'head', label: 'Head', sphere: [0.27, 0.47, 0, 0.21] },
        { id: 'tail', label: 'Tail puff', sphere: [-0.38, 0.28, 0, 0.12] },

      reactions: [
        { on: 'grab', behavior: 'held' },
        { on: 'poke', region: 'head', behavior: 'groomed' },
        { on: 'poke', behavior: 'startle' },
        { on: 'stroke', behavior: 'groomed' },
        { on: 'comb', behavior: 'groomed' },
      ],
    },
    actions: {
      hop: { run: (ctx) => ctx.behaviors.request('hop') },
      binky: { run: (ctx) => ctx.behaviors.request('binky') },
      sniff: { run: (ctx) => ctx.behaviors.request('sniff') },
    },
    controls: [
      { id: 'hop', type: 'button', label: 'Hop', action: 'hop', group: 'Actions', primary: true },
      { id: 'binky', type: 'button', label: 'Binky', action: 'binky', group: 'Actions', hint: 'A joyful twisting leap' },
      { id: 'sniff', type: 'button', label: 'Sniff', action: 'sniff', group: 'Actions' },
      { id: 'smooth', type: 'button', label: 'Smooth fur', action: 'engine.smoothFur', group: 'Actions' },
      { id: 'wander', type: 'toggle', label: 'Wander', bind: 'flags.wander', default: true, group: 'Behaviour' },
      { id: 'stuffing', type: 'slider', label: 'Stuffing', bind: 'physics.stuffing', min: 0.3, max: 1.5, step: 0.01, default: 1, group: 'Body', format: (v) => `${Math.round(v * 100)}%` },
      { id: 'pile', type: 'slider', label: 'Pile', bind: 'fur.pile', min: 0, max: 2, step: 0.01, default: 1, group: 'Body', format: (v) => `${(v * 0.03 * 250).toFixed(1)} mm` },
      { id: 'hopHeight', type: 'slider', label: 'Hop height', bind: 'locomotion.hopHeight', min: 0.4, max: 1.8, step: 0.01, default: 1, group: 'Body', format: (v) => `${v.toFixed(2)}×` },
      { id: 'fabric', type: 'preset', label: 'Fabric', bind: 'material.preset', default: 'oat', group: 'Fabric' },
    ],
    readouts: [
      { id: 'mass', label: 'Mass', unit: 'g', get: (r) => r.metrics.mass, format: (v) => v.toFixed(0) },
      { id: 'volume', label: 'Volume', unit: 'L', get: (r) => r.metrics.volume, format: (v) => v.toFixed(2) },
      { id: 'hops', label: 'Hops', unit: '', get: (r) => r.locomotion.hops, format: (v) => String(v) },
    ],
    notes: {
      anatomy: 'One blended SDF (body, haunches, head, cheeks, feet, puff tail, planar ears) with no attached parts and no joints.',
      implemented: [
        'Hop locomotion: crouch, ballistic launch under gravity, flight with stretch, and landing with floor friction.',
        'The ears are lightly stuffed lattice cells, so they flop and bounce on their own. They are not animated.',
        'A poke anywhere except the head startles it into a hop away; the comb, petting or a poke on the head make it relax.',
      ],
      approximations: [
        'This prototype only checks that the architecture works. Its behaviour set and anatomy are intentionally small.',
      ],
    },
  };
})();

/* Planned species: listed for the selector, never playable. */
const PlannedCat = { id: 'cat', name: 'Plush Cat', category: 'Felid', status: 'planned', description: 'Walk, stretch, pounce and groom.' };
const PlannedSongbird = { id: 'songbird', name: 'Plush Songbird', category: 'Passerine', status: 'planned', description: 'Fly, land, flap and preen.' };

[PlushHammerhead, DustBunny, PlannedCat, PlannedSongbird].forEach((s) => Engine.registerSpecies(s));
if (typeof module !== 'undefined') module.exports = { PlushHammerhead, DustBunny };

<script id="app-src">

(() => {

const STEP = 1 / 60, MAX_STEPS = 3;
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v);

};

];

const LIGHTS = {

  fill: v3.norm([0.7, 0.25, -0.45]), fillColor: [0.2, 0.22, 0.27],
  sky: [0.4, 0.41, 0.43], ground: [0.2, 0.18, 0.16],
};

const ENGINE_NOTES = {
  implemented: [
    'XPBD soft body: every hex cell is shape-matched (Müller rotation extraction, warm-started, mass-weighted so momentum is conserved) and split into five tetrahedra with volume constraints. Stuffing scales compliance, inflation and mass.',
    'The lattice is built from the species SDF so that it covers every render vertex. A surface-nets mesh is embedded in it and skinned on the GPU by trilinear FFD, and normals use the cofactor of the local deformation gradient.',
    'Rigid parts attach to the lattice frame at an anchor (polar decomposition of the local deformation gradient) and can hang off an optional 1-DoF damped joint.',
    'Fur uses alpha-to-coverage shells (4× MSAA) with procedural tapered strands. The pile lags on a spring driven by particle acceleration and drag, and a per-vertex comb field and minky nap shading show where it was brushed.',

/* ---------- Orbit camera ------------------------------------------------- */
class OrbitCamera {
  constructor() { this.yaw = 0.6; this.pitch = 0.3; this.dist = 6; this.target = [0, 1, 0]; this.base = [0, 1, 0]; this.follow = 0.5; this.fov = (30 * Math.PI) / 180; }
  configure(cfg) {
    Object.assign(this, { yaw: cfg.yaw, pitch: cfg.pitch, dist: cfg.distance, follow: cfg.follow ?? 0.5 });
    this.base = cfg.target.slice(); this.target = cfg.target.slice(); this.home = { ...cfg };
  }
  update(dt, focus) {
    const want = v3.lerp(this.base, focus, this.follow);
    this.target = v3.lerp(this.target, want, damp(1.8, dt));
  }
  eye(aspect) {
    const d = this.dist * Math.pow(Math.max(1, 1.25 / aspect), 0.75), cp = Math.cos(this.pitch);
    return [this.target[0] + d * cp * Math.sin(this.yaw), this.target[1] + d * Math.sin(this.pitch), this.target[2] + d * cp * Math.cos(this.yaw)];
  }
  matrices(aspect) {
    const eye = this.eye(aspect);
    const vp = mat4.mul(mat4.perspective(this.fov, aspect, 0.05, 80), mat4.lookAt(eye, this.target, [0, 1, 0]));
    this.cache = { eye, viewProj: vp, inv: mat4.invert(vp), aspect };
    return this.cache;
  }
  ray(nx, ny) {
    const { inv, eye } = this.cache, a = mat4.xform(inv, [nx, ny, 0]), b = mat4.xform(inv, [nx, ny, 1]);
    return { o: a, d: v3.norm(v3.sub(b, a)), view: v3.norm(v3.sub(this.target, eye)) };
  }
}

        const input = el('input', { type: 'range', id, min: c.min, max: c.max, step: c.step || 0.01, value: v0 });
        const paint = (v) => { out.textContent = c.format ? c.format(+v) : (+v).toFixed(2); input.style.setProperty('--p', `${((v - c.min) / (c.max - c.min)) * 100}%`); };
        input.addEventListener('input', () => { B.set(c.bind, +input.value); paint(input.value); });
        paint(v0);
        wrap.append(el('div', { class: 'slider' }, el('div', { class: 'row' }, el('label', { for: id, text: label() }), out), input));
        live.push(() => { input.disabled = !B.enabled(c); });
      } else if (c.type === 'select') {
        const s = el('select', { class: 'sel', 'aria-label': label() }, ...c.options.map((o) => el('option', { value: o.value, text: o.label })));
        s.value = B.get(c.bind) ?? c.default;
        s.addEventListener('change', () => B.set(c.bind, s.value));
        wrap.append(s);
      } else if (c.type === 'preset') {
        const row = el('div', { class: 'swatches', role: 'radiogroup', 'aria-label': label() });
        const opts = B.presets(c), cur = () => B.get(c.bind) ?? c.default;
        const btns = opts.map((o) => {
          const b = el('button', { class: 'swatch', type: 'button', role: 'radio', 'aria-checked': String(cur() === o.id) },
            el('span', { class: 'chip', style: `background: linear-gradient(180deg, ${o.colors[0]} 0 56%, ${o.colors[1]} 56% 100%)` }), o.label);
          b.addEventListener('click', () => { B.set(c.bind, o.id); btns.forEach((x, i) => x.setAttribute('aria-checked', String(opts[i].id === o.id))); });
          return b;
        });
        row.append(...btns);
        wrap.append(row);
      }
    }
    container.append(wrap);
  }
  return () => live.forEach((f) => f());
}

/* ---------- Application -------------------------------------------------- */
class App {
  constructor() {
    this.canvas = $('gpu');
    this.paused = false; this.quarter = false; this.debugMesh = false;
    this.toolId = 'hand'; this.assets = new Map();
    this.creature = null; this.def = null; this.renderer = null;
    this.camera = new OrbitCamera();
    this.acc = 0; this.last = performance.now(); this.stepMs = 0; this.uiClock = 0;
    this.pointers = new Map(); this.mode = null; this.hover = null; this.toolHintUntil = 0;
    this.purity = this.scanEngineSource();
  }
  async start() {
    this.buildSpeciesList();
    this.refreshGlobal = renderControls($('globalControls'), GLOBAL_CONTROLS, this.globalBinding());
    try {
      this.renderer = await Engine.Renderer.create(this.canvas);
      this.renderer.device.lost.then((info) => { if (info.reason !== 'destroyed') this.fail(new Error(`The GPU device was lost (${info.message || info.reason}).`)); });
    } catch (err) { this.fail(err); }
    const first = Engine.registry.find((s) => s.status === 'complete' && s.validation.ok);
    await this.loadSpecies(first.id);
    this.bindInput();
    new ResizeObserver(() => (this.needsResize = true)).observe($('viewport'));
    this.needsResize = true;
    addEventListener('pagehide', () => this.renderer?.destroy());
    requestAnimationFrame((t) => this.frame(t));
  }
  fail(err) {
    console.error(err);
    const box = $('fallback'), webgpu = err instanceof Engine.GPUUnavailable;
    box.hidden = false;
    box.innerHTML = '';
    box.append(el('div', { class: 'box' },
      el('h3', { text: webgpu ? 'WebGPU isn’t available here' : 'The renderer stopped' }),
      el('p', { text: err.message }),
      el('p', { text: webgpu
        ? 'Plush Creatures needs WebGPU for GPU skinning, fur shells and shadows. Try a current Chrome or Edge, Safari 18 or later, or Firefox with WebGPU enabled, on a device with hardware acceleration turned on.'
        : 'Reload the page to try again. If it keeps happening, the browser may have blocked the GPU for this tab.' }),
      el('p', { text: 'The species definitions, controls and technical notes on this page are still generated from the engine, but the simulation will not run without a renderer.' })));
    this.renderer = null;
    $('stateLabel').textContent = 'Renderer unavailable';
  }
  /* ---- species lifecycle */
  buildSpeciesList() {
    const list = $('speciesList');
    list.textContent = '';
    for (const s of Engine.registry) {
      const playable = s.status !== 'planned' && s.validation.ok;
      const chip = { complete: 'Complete', prototype: 'Prototype', planned: 'Planned' }[s.status] || s.status;
      const b = el('button', { class: 'species-opt', type: 'button', role: 'radio', 'aria-checked': 'false', 'data-id': s.id, disabled: !playable,
        title: playable ? s.description : `${s.description} — not implemented yet` },
        el('span', { class: 'nm', text: s.name }), el('span', { class: 'ct', text: playable ? s.category : `${s.category} · not playable` }),
        el('span', { class: `chip ${s.status}`, text: chip }));
      if (playable) b.addEventListener('click', () => this.loadSpecies(s.id));
      list.append(b);
    }
  }
  async loadSpecies(id) {
    const def = Engine.registry.find((s) => s.id === id);
    if (!def || def.status === 'planned' || (this.def && this.def.id === id)) return;
    const ov = $('overlay');
    ov.textContent = `Sewing the ${def.name}…`; ov.hidden = false;
    await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 30)));
    this.endInteraction();
    let assets = this.assets.get(id);
    if (!assets) { assets = Engine.buildCreatureAssets(def); this.assets.set(id, assets); }
    this.def = def;
    this.creature = new Engine.Creature(def, assets, { seed: 7 });
    this.materialPreset = null;
    this.renderer?.setCreature(this.creature);
    this.camera.configure(def.environment.camera);
    const tools = this.toolsFor(def);
    if (!tools.includes(this.toolId)) this.toolId = tools[0];
    this.buildSpeciesUI();
    this.acc = 0;
    ov.hidden = true;
  }
  toolsFor(def) { return def.interactions.tools.filter((t) => Engine.TOOLS[t] && (Engine.TOOLS[t].requires !== 'fur' || def.fur)); }
  buildSpeciesUI() {
    const def = this.def, D = def.display;
    document.title = `${def.name} — Plush Creatures`;
    document.documentElement.style.setProperty('--accent', D.theme?.accent || '#8a5a33');
    $('kicker').textContent = D.kicker;
    $('title').querySelector('.l1').textContent = D.title[0];
    $('title').querySelector('.l2').textContent = D.title[1];
    $('lede').textContent = D.description;
    $('speciesName').textContent = def.name;
    $('meta').textContent = `WebGPU · XPBD · ${Engine.ENVIRONMENTS[def.environment.preset].label}`;
    for (const b of $('speciesList').children) b.setAttribute('aria-checked', String(b.dataset.id === def.id));
    // tools
    const tools = $('tools');
    tools.textContent = '';
    for (const t of this.toolsFor(def)) {
      const T = Engine.TOOLS[t];
      const b = el('button', { class: 'tool', type: 'button', role: 'radio', 'aria-checked': String(t === this.toolId), title: T.hint },
        el('span', { class: 'g', 'aria-hidden': 'true', text: T.glyph }), T.label);
      b.addEventListener('click', () => this.setTool(t));
      tools.append(b);
    }
    this.toolHintUntil = performance.now() + 6000;
    // controls
    this.refreshSpecies = renderControls($('speciesControls'), def.controls, this.speciesBinding());
    // readouts
    const ro = $('readouts');
    ro.textContent = '';
    this.readoutEls = def.readouts.map((r) => {
      const dd = el('dd', {}, el('span', { text: '—' }), r.unit ? el('small', { text: r.unit }) : null);
      ro.append(el('div', { class: 'readout' }, el('dt', { text: r.label }), dd));
      return { r, span: dd.firstChild };
    });
    this.buildNotes();
    this.refreshUI();
  }
  setTool(t) {
    this.toolId = t;
    for (const b of $('tools').children) b.setAttribute('aria-checked', String(b.textContent.includes(Engine.TOOLS[t].label)));
    this.toolHintUntil = performance.now() + 5000;
  }
  /* ---- bindings */
  speciesBinding() {
    const app = this, def = this.def, regs = Object.keys(def.materials.regions);
    return {
      prefix: def.id,
      labelCtx: () => app.creature.ctx,
      run: (c) => app.runAction(c.action),
      enabled: (c) => app.actionEnabled(c),
      get: (bind) => app.creature.getParam(bind),
      set: (bind, v) => app.creature.setParam(bind, v),
      presets: () => def.materials.presets.map((p) => ({ id: p.id, label: p.label, colors: (def.materials.swatch || regs.slice(0, 2)).map((r) => p.colors[r]) })),
    };
  }
  globalBinding() {
    const app = this;
    return {
      prefix: 'global', labelCtx: () => app, enabled: () => true,
      run: (c) => app.runAction(c.action),
      get: (bind) => app[bind.split('.')[1]],
      set: (bind, v) => { app[bind.split('.')[1]] = v; },
    };
  }
  runAction(id) {
    const c = this.creature;
    if (id === 'app.pause') { this.paused = !this.paused; this.last = performance.now(); }
    else if (id === 'app.reset') { if (c) { this.endInteraction(); c.reset(); this.camera.configure(this.def.environment.camera); } }
    else if (!c) return;
    else if (Engine.ENGINE_ACTIONS[id]) Engine.ENGINE_ACTIONS[id].run(c);
    else if (this.def.actions[id]) this.def.actions[id].run(c.ctx);
    this.refreshUI();
  }
  actionEnabled(control) {
    const c = this.creature;
    if (!c || !this.renderer) return false;
    if (control.enabled && !control.enabled(c.ctx)) return false;
    const a = this.def.actions?.[control.action];
    return !(a && a.enabled && !a.enabled(c.ctx));
  }
  /* ---- notes */
  buildNotes() {
    const def = this.def, A = this.creature.assets, body = $('notesBody');
    body.textContent = '';
    const list = (items, tag, cls) => el('ul', {}, ...items.map((t) => el('li', {}, el('span', { class: `tag ${cls}`, text: tag }), t)));
    body.append(
      el('h3', { text: `${def.name} — anatomy` }), el('p', { text: def.notes.anatomy }),
      el('p', { class: 'kv', text: `${A.vertexCount.toLocaleString()} vertices · ${A.triangles.toLocaleString()} triangles · ${A.lattice.n} particles · ${A.lattice.nc} hexes · ${A.lattice.tets.length / 4} tets · ${A.decalCount} stitch segments · built in ${A.buildMs.toFixed(0)} ms` }),
      el('h3', { text: 'Species behaviour' }), list(def.notes.implemented, 'Implemented', 'ok'), list(def.notes.approximations, 'Approx.', 'approx'),
      el('h3', { text: 'Engine' }), list(ENGINE_NOTES.implemented, 'Implemented', 'ok'), list(ENGINE_NOTES.approximations, 'Approx.', 'approx'), list(ENGINE_NOTES.limitations, 'Limit', 'limit'),
      el('h3', { text: 'Architecture checks' }),
      el('ul', {}, ...Engine.registry.map((s) => el('li', {}, el('span', { class: `tag ${s.validation.ok ? 'ok' : 'limit'}`, text: s.validation.ok ? 'Valid' : 'Invalid' }),
        `${s.name}: ${s.validation.planned ? 'planned, identity only (not playable)' : `${s.validation.checks} definition checks passed against engine capabilities`}${s.validation.errors.length ? ' — ' + s.validation.errors.join('; ') : ''}`)),
        el('li', {}, el('span', { class: `tag ${this.purity.hits.length ? 'limit' : 'ok'}`, text: this.purity.hits.length ? 'Leak' : 'Clean' }),
          this.purity.scanned ? `Engine source scanned for ${this.purity.terms.length} species-specific identifiers (${this.purity.terms.join(', ')}): ${this.purity.hits.length ? 'found ' + this.purity.hits.join(', ') : 'none found'}.` : 'Engine source scan unavailable.')),
    );
  }
  scanEngineSource() {
    const src = (document.getElementById('engine-src')?.textContent || '').replace(/\/\*[\s\S]*?\*\//g, '');
    const terms = new Set();
    for (const s of Engine.registry) {
      terms.add(s.id);
      s.name.split(/\s+/).forEach((w) => { if (w.length > 2 && w.toLowerCase() !== 'plush') terms.add(w.toLowerCase()); });
      (s.anatomy?.parts || []).forEach((p) => { if (p.attach) terms.add(p.id.toLowerCase()); });
      Object.keys(s.anatomy?.joints || {}).forEach((j) => terms.add(j.toLowerCase()));
      Object.keys(s.items || {}).forEach((i) => terms.add(i.toLowerCase()));
    }
    const esc = (t) => t.replace(/[.*+?^${}()|[\]\\-]/g, '\\$&');
    const hits = [...terms].filter((t) => new RegExp(`\\b${esc(t)}\\b`, 'i').test(src));
    return { scanned: src.length > 0, terms: [...terms], hits };
  }
  /* ---- input */
  bindInput() {
    const cv = this.canvas;
    const ndc = (e) => { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * 2 - 1, 1 - ((e.clientY - r.top) / r.height) * 2]; };
    const pick = (e) => {
      if (!this.creature || !this.camera.cache) return { hit: null, ray: null };
      const [x, y] = ndc(e), ray = this.camera.ray(x, y);
      return { ray, hit: this.creature.raycast(ray.o, ray.d) };
    };
    cv.addEventListener('pointerdown', (e) => {
      if (!this.renderer) return;
      cv.setPointerCapture(e.pointerId);
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this.pointers.size === 2) { this.endInteraction(); this.mode = 'pinch'; this.pinch = this.pinchDist(); return; }
      const { hit, ray } = pick(e), tool = Engine.TOOLS[this.toolId];
      if (hit && tool.begin(this.creature, hit, ray)) { this.mode = 'tool'; this.toolHintUntil = 0; }
      else this.mode = 'orbit';
      cv.classList.add('dragging');
    });
    cv.addEventListener('pointermove', (e) => {
      const prev = this.pointers.get(e.pointerId);
      if (!prev) { this.hoverAt(e, pick); return; }
      const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this.mode === 'pinch' && this.pointers.size === 2) {
        const d = this.pinchDist();
        this.camera.dist = clamp(this.camera.dist * (this.pinch / d), 2, 16); this.pinch = d;
      } else if (this.mode === 'orbit') {
        this.camera.yaw -= dx * 0.006; this.camera.pitch = clamp(this.camera.pitch + dy * 0.005, 0.04, 1.35);
      } else if (this.mode === 'tool') {
        const { hit, ray } = pick(e);
        Engine.TOOLS[this.toolId].move(this.creature, hit, ray);
      }
    });
    const up = (e) => {
      if (!this.pointers.has(e.pointerId)) return;
      this.pointers.delete(e.pointerId);
      if (this.mode === 'tool') this.endInteraction();
      if (this.pointers.size === 0) { this.mode = null; cv.classList.remove('dragging'); }
    };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', () => { if (!this.pointers.size) { this.hover = null; cv.classList.remove('on-creature'); } });
    cv.addEventListener('wheel', (e) => { e.preventDefault(); this.camera.dist = clamp(this.camera.dist * Math.exp(e.deltaY * 0.0012), 2, 16); }, { passive: false });
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.closest('input, select, textarea')) return;
      if (e.key === ' ' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); this.runAction('app.pause'); }
      else if (e.key === 'r' || e.key === 'R') this.runAction('app.reset');
      else if (/^[1-9]$/.test(e.key)) { const t = this.toolsFor(this.def)[+e.key - 1]; if (t) this.setTool(t); }
    });
  }
  pinchDist() { const p = [...this.pointers.values()]; return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1; }
  hoverAt(e, pick) {
    if (e.pointerType !== 'mouse' || performance.now() - (this.hoverT || 0) < 70) return;
    this.hoverT = performance.now();
    const { hit } = pick(e);
    this.hover = hit;
    this.canvas.classList.toggle('on-creature', !!hit);
  }
  endInteraction() {
    if (this.mode === 'tool' && this.creature) Engine.TOOLS[this.toolId].end(this.creature);
    if (this.mode === 'tool') this.mode = null;
  }
  /* ---- loop */
  frame(now) {
    requestAnimationFrame((t) => this.frame(t));
    const dt = Math.min((now - this.last) / 1000, 0.1);
    this.last = now;
    const c = this.creature;
    if (c && this.renderer && !this.paused) {
      this.acc += dt * (this.quarter ? 0.25 : 1);
      let n = 0;
      const t0 = performance.now();
      while (this.acc >= STEP && n < MAX_STEPS) { c.step(STEP); this.acc -= STEP; n++; }
      if (this.acc >= STEP) this.acc = 0;
      if (n) this.stepMs = lerp(this.stepMs || (performance.now() - t0) / n, (performance.now() - t0) / n, 0.08);
    }
    this.uiClock += dt;
    if (this.uiClock > 0.15) { this.uiClock = 0; this.refreshUI(); }
    if (!this.renderer || !c) return;
    if (this.needsResize) this.resize();
    this.camera.update(dt, c.sim.frame.c);
    this.renderer.render(this.frameState());
  }
  resize() {
    this.needsResize = false;
    const r = this.canvas.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    let w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    const max = 2.6e6;
    if (w * h > max) { const s = Math.sqrt(max / (w * h)); w = Math.round(w * s); h = Math.round(h * s); }
    const lim = this.renderer.device.limits.maxTextureDimension2D;
    this.renderer.resize(Math.min(w, lim), Math.min(h, lim));
  }
  frameState() {
    const c = this.creature, def = this.def, env = c.env.cfg, b = c.env.bounds, [w, h] = this.renderer.size;
    const cam = this.camera.matrices(w / h);
    if (this.materialPreset !== c.presetId) { this.materialTable = Engine.buildMaterialTable(def, c.presetId); this.materialPreset = c.presetId; }
    const center = [(b.min[0] + b.max[0]) / 2, b.min[1], (b.min[2] + b.max[2]) / 2];
    const lightView = mat4.lookAt(v3.add(center, v3.scale(LIGHTS.key, 14)), center, [0, 1, 0]);
    const lightViewProj = mat4.mul(mat4.ortho(-6, 6, -6, 6, 1, 30), lightView);
    const bg = env.background, bgLin = hexToLinear(bg), bgS = [1, 3, 5].map((i) => parseInt(bg.slice(i, i + 2), 16) / 255);
    const fur = def.fur && c.fur ? [def.fur.length * c.fur.pile, c.fur.pile > 0.02 ? def.fur.shells : 0, def.fur.density, def.fur.droop] : [0, 0, 0, 0];
    return {
      viewProj: cam.viewProj, lightViewProj, eye: cam.eye, time: c.env.time,
      keyDir: LIGHTS.key, shadowStrength: 0.85, keyColor: LIGHTS.keyColor, fillDir: LIGHTS.fill, fillColor: LIGHTS.fillColor,
      skyColor: LIGHTS.sky, groundColor: LIGHTS.ground, bgColor: bgLin, bgClear: bgS, floorColor: hexToLinear(env.floor),
      fur, env: [b.min[1], env.floorPattern === 'caustics' ? 1 : 0, env.fadeRadius, 0], bounds: [b.min[0], b.min[2], b.max[0], b.max[2]],
      materials: this.materialTable, creature: c, debugMesh: this.debugMesh,
      items: c.env.items.map((it) => ({ type: it.type, matrix: c.env.itemMatrix(it) })),
    };
  }
  refreshUI() {
    const c = this.creature;
    this.refreshGlobal?.();
    if (!c) return;
    this.refreshSpecies?.();
    c.updateMetrics();
    const rctx = { metrics: c.metrics, locomotion: c.loco.readouts, state: c.state };
    for (const { r, span } of this.readoutEls || []) {
      const v = r.get(rctx);
      span.textContent = r.format ? r.format(v) : String(v);
    }
    const st = $('status');
    st.classList.toggle('paused', this.paused);
    $('stateLabel').textContent = !this.renderer ? 'Renderer unavailable' : this.paused ? 'Paused' : c.machine.label() + (this.quarter ? ' · ¼×' : '');
    const A = c.assets, sh = def => (def.fur && c.fur.pile > 0.02 ? def.fur.shells : 0);
    $('engineLine').textContent = `lattice ${A.lattice.n} particles · ${A.lattice.nc} hexes · ${A.lattice.tets.length / 4} tets · ${(A.triangles / 1000).toFixed(1)}k triangles × ${1 + sh(this.def)} layers · ${this.stepMs.toFixed(1)} ms / step`;
    const hint = $('hint'), T = Engine.TOOLS[this.toolId];
    if (this.hover && this.hover.regions.length && !this.mode) {
      const labels = this.def.interactions.regions.filter((r) => this.hover.regions.includes(r.id)).map((r) => r.label);
      hint.textContent = `${labels[0]} · ${T.label}`;
    } else hint.textContent = performance.now() < this.toolHintUntil ? T.hint : '';
  }
}

const app = new App();
window.plushApp = app;
app.start().catch((err) => app.fail(err));
})();
