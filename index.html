<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plush Creatures</title>
<meta name="description" content="Species-driven soft-body plush creature simulator (WebGPU).">
<style>
:root {
  --bg: #d7d1c7;
  --bg-deep: #cbc4b8;
  --card: #e6e1d8;
  --card-2: #ece8e0;
  --ink: #221f1b;
  --ink-2: #4b453d;
  --muted: #7a7266;
  --line: rgba(34, 31, 27, 0.14);
  --line-2: rgba(34, 31, 27, 0.08);
  --accent: #8a5a33;
  --accent-ink: #fbf7f0;
  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, "Apple Garamond", Georgia, serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --radius: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
.page { max-width: 1480px; margin: 0 auto; padding: 22px 28px 40px; }

/* masthead */
.masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.brand { font: 600 13px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; }
.brand em { font: italic 400 15px/1 var(--serif); letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: 8px; }
.masthead .meta { font: 12px/1 var(--mono); color: var(--muted); }

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 348px; gap: 28px; margin-top: 22px; align-items: start; }
.stage { min-width: 0; }
.title-block { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 8px 36px; align-items: end; margin-bottom: 18px; }
.kicker { grid-column: 1 / -1; margin: 0; font: 600 11.5px/1 var(--sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-family: var(--serif); font-weight: 400; line-height: 0.86; letter-spacing: -0.02em; }
h1 .l1 { display: block; font-style: italic; font-size: clamp(30px, 3.6vw, 52px); color: var(--ink-2); margin-left: 0.08em; }
h1 .l2 { display: block; font-size: clamp(54px, 7.6vw, 116px); }
.lede { margin: 0 0 6px; max-width: 46ch; font: 17px/1.45 var(--serif); color: var(--ink-2); }

/* viewport */
.viewport { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--bg-deep);
  aspect-ratio: 16 / 9.4; min-height: 380px; box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 0 rgba(255,255,255,0.35); }
.viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
.viewport canvas.on-creature { cursor: pointer; }
.viewport canvas.dragging { cursor: grabbing; }
.tools { position: absolute; left: 14px; top: 14px; display: flex; gap: 4px; padding: 4px; border-radius: 999px;
  background: rgba(236, 232, 224, 0.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
.tool { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 11px; border: 0; border-radius: 999px; background: transparent; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.tool .g { font-size: 15px; width: 16px; text-align: center; }
.tool:hover { background: rgba(34,31,27,0.06); }
.tool[aria-checked="true"] { background: var(--ink); color: var(--card-2); }
.tool:focus-visible, .btn:focus-visible, .switch:focus-visible, .swatch:focus-visible, .species-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { position: absolute; right: 14px; top: 14px; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px;
  border-radius: 999px; background: rgba(236, 232, 224, 0.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 13px; color: var(--ink-2); }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.status.paused .dot { background: var(--muted); box-shadow: none; }
.hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: calc(100% - 28px); padding: 7px 14px; border-radius: 999px;
  background: rgba(34, 31, 27, 0.72); color: #f3efe8; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; transition: opacity .25s; }
.hint:empty { opacity: 0; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(215, 209, 199, 0.72); font: italic 22px/1.3 var(--serif); color: var(--ink-2); transition: opacity .3s; }
.overlay[hidden] { display: grid; opacity: 0; pointer-events: none; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 28px; background: var(--card); }
.fallback[hidden] { display: none; }
.fallback .box { max-width: 520px; }
.fallback h3 { margin: 0 0 8px; font: 400 28px/1.15 var(--serif); }
.fallback p { margin: 0 0 10px; color: var(--ink-2); }
.fallback code { font: 12.5px var(--mono); background: rgba(34,31,27,0.06); padding: 2px 6px; border-radius: 6px; }

/* readouts */
.readouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 0; margin: 16px 0 0; border-top: 1px solid var(--line); }
.readout { padding: 12px 16px 2px 0; }
.readout + .readout { padding-left: 16px; border-left: 1px solid var(--line-2); }
.readout dt { font: 600 10.5px/1 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.readout dd { margin: 8px 0 0; font: 400 32px/1 var(--serif); font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; }
.readout dd small { font: 13px var(--sans); color: var(--muted); margin-left: 4px; }
.readout.wide dd { font-size: 20px; line-height: 1.25; white-space: normal; }
.engine-line { margin: 12px 0 0; font: 11.5px/1.5 var(--mono); color: var(--muted); }

/* panel */
.panel { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 32px); overflow: auto; padding-bottom: 4px; scrollbar-width: thin; }
.block { background: var(--card); border-radius: var(--radius); padding: 16px 16px 14px; box-shadow: inset 0 0 0 1px var(--line-2); }
.block h2 { margin: 0 0 12px; font: 600 11px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.block h2 span { letter-spacing: 0.04em; text-transform: none; font-weight: 400; }
.group + .group { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line-2); }
.group-label { font: 600 11px/1 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; }

.species-list { display: grid; gap: 6px; }
.species-opt { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; width: 100%; padding: 10px 12px; text-align: left; border: 0; border-radius: 10px;
  background: var(--card-2); cursor: pointer; box-shadow: inset 0 0 0 1px var(--line-2); }
.species-opt:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--line); }
.species-opt[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--ink); background: #f4f1eb; }
.species-opt:disabled { cursor: not-allowed; opacity: 0.55; background: transparent; }
.species-opt .nm { font: 400 17px/1.2 var(--serif); }
.species-opt .ct { grid-column: 1; font-size: 12px; color: var(--muted); }
.species-opt .chip { grid-row: 1 / span 2; grid-column: 2; font: 600 10px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: rgba(34,31,27,0.07); color: var(--ink-2); }
.species-opt .chip.complete { background: var(--ink); color: var(--card-2); }

.btn-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.btn { min-height: 38px; padding: 6px 10px; border: 0; border-radius: 10px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; font-size: 13.5px; font-weight: 500; }
.btn:hover:not(:disabled) { background: #f5f2ec; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, black); }
.btn.wide { grid-column: span 3; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.flash { animation: flash .35s; }
@keyframes flash { from { box-shadow: inset 0 0 0 2px var(--accent); } }

.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.toggle-row + .toggle-row { border-top: 1px solid var(--line-2); }
.toggle-row .lbl { font-size: 14px; }
.toggle-row .sub { display: block; font-size: 12px; color: var(--muted); }
.switch { position: relative; flex: none; width: 42px; height: 24px; border: 0; border-radius: 999px; background: rgba(34,31,27,0.18); cursor: pointer; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--ink); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }

.slider + .slider { margin-top: 12px; }
.slider .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.slider label { font-size: 14px; }
.slider output { font: 12.5px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--ink) var(--p, 50%), rgba(34,31,27,0.18) var(--p, 50%)); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: rgba(34,31,27,0.18); }
input[type=range]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--ink); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7.5px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 1.5px solid var(--ink); }
input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.swatch { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 10px 6px 8px; border: 0; border-radius: 10px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line-2); cursor: pointer; font-size: 12.5px; }
.swatch .chip { width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
.swatch[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--ink); background: #f4f1eb; }
select.sel { width: 100%; height: 36px; border-radius: 10px; border: 0; padding: 0 10px; background: var(--card-2); box-shadow: inset 0 0 0 1px var(--line); }

/* notes */
.notes { background: var(--card); border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--line-2); }
.notes > summary { list-style: none; cursor: pointer; padding: 15px 16px; font: 600 11px/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.notes > summary::-webkit-details-marker { display: none; }
.notes > summary::after { content: "+"; font: 400 16px/0.7 var(--sans); }
.notes[open] > summary::after { content: "–"; }
.notes-body { padding: 0 16px 16px; font-size: 13px; line-height: 1.55; color: var(--ink-2); }
.notes-body h3 { margin: 14px 0 6px; font: 600 11px/1 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); }
.notes-body h3:first-child { margin-top: 0; }
.notes-body ul { margin: 0; padding-left: 16px; }
.notes-body li + li { margin-top: 4px; }
.notes-body .tag { display: inline-block; font: 600 9.5px/1 var(--sans); letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
.tag.ok { background: #d8e4d0; color: #2f4a25; }
.tag.approx { background: #efdcc4; color: #6b4316; }
.tag.limit { background: #e6d3d3; color: #6b2a2a; }
.notes-body .kv { font: 12px var(--mono); }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 1080px) {
  .layout { grid-template-columns: minmax(0, 1fr) 312px; gap: 20px; }
  .title-block { grid-template-columns: 1fr; }
  .lede { max-width: 60ch; }
}
@media (max-width: 860px) {
  .page { padding: 14px 16px 32px; }
  .masthead .meta { display: none; }
  .layout { grid-template-columns: 1fr; gap: 16px; margin-top: 14px; }
  .panel { position: static; max-height: none; overflow: visible; }
  .title-block { margin-bottom: 12px; }
  h1 .l2 { font-size: clamp(46px, 14vw, 84px); }
  .lede { font-size: 15.5px; }
  .viewport { aspect-ratio: auto; height: min(64vh, 560px); min-height: 340px; margin: 0 -16px; border-radius: 0; }
  .tools { left: 50%; top: auto; bottom: 12px; transform: translateX(-50%); }
  .tool { height: 42px; padding: 0 16px 0 13px; font-size: 14px; }
  .hint { bottom: 66px; }
  .status { top: 12px; right: 12px; }
  .readouts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .readout:nth-child(odd) { padding-left: 0; border-left: 0; }
  .readout { border-bottom: 1px solid var(--line-2); padding-bottom: 10px; }
  .readout dd { font-size: 26px; }
  .btn { min-height: 44px; }
  .switch { width: 48px; height: 28px; }
  .switch::after { width: 22px; height: 22px; }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="brand">Plush Creatures<em>a soft-body studio</em></div>
    <div class="meta" id="meta">WebGPU · XPBD</div>
  </header>
  <main class="layout">
    <section class="stage" aria-label="Simulation">
      <div class="title-block">
        <p class="kicker" id="kicker"></p>
        <h1 id="title"><span class="l1"></span><span class="l2"></span></h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="viewport" id="viewport">
        <canvas id="gpu" tabindex="0" aria-label="Interactive plush simulation viewport"></canvas>
        <div class="tools" id="tools" role="radiogroup" aria-label="Interaction tool"></div>
        <div class="status" id="status" aria-live="polite"><span class="dot"></span><span id="stateLabel">Starting…</span></div>
        <div class="hint" id="hint"></div>
        <div class="overlay" id="overlay">Sewing…</div>
        <div class="fallback" id="fallback" hidden></div>
      </div>
      <dl class="readouts" id="readouts"></dl>
      <p class="engine-line" id="engineLine"></p>
    </section>
    <aside class="panel" id="panel" aria-label="Controls">
      <section class="block"><h2>Species</h2><div class="species-list" id="speciesList" role="radiogroup" aria-label="Species"></div></section>
      <section class="block" id="speciesBlock"><h2>Controls <span id="speciesName"></span></h2><div id="speciesControls"></div></section>
      <section class="block"><h2>Simulation <span>global</span></h2><div id="globalControls"></div></section>
      <details class="notes" id="notes"><summary>Technical notes</summary><div class="notes-body" id="notesBody"></div></details>
    </aside>
  </main>
</div>

<!-- ===== ENGINE (species-independent) ===== -->
<script id="engine-src">
'use strict';
/* =========================================================================
   PLUSH CREATURES — ENGINE
   Species-independent systems. Nothing in the engine may reference a
   particular animal: anatomy, physics tuning, locomotion choice, behaviours,
   interaction regions, materials and controls all arrive through a
   SpeciesDefinition object (see the SPECIES script further down).
   ========================================================================= */
const Engine = (() => {

/* ---------- 0. Math ---------------------------------------------------- */
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const wrapAngle = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);

const v3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
};

/** Deterministic PRNG (mulberry32). */
function makeRng(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Column-major 3x3 from quaternion [x,y,z,w]. */
function quatToMat3(q, out = new Float64Array(9), o = 0) {
  const x = q[o], y = q[o + 1], z = q[o + 2], w = q[o + 3];
  out[0] = 1 - 2 * (y * y + z * z); out[1] = 2 * (x * y + w * z); out[2] = 2 * (x * z - w * y);
  out[3] = 2 * (x * y - w * z); out[4] = 1 - 2 * (x * x + z * z); out[5] = 2 * (y * z + w * x);
  out[6] = 2 * (x * z + w * y); out[7] = 2 * (y * z - w * x); out[8] = 1 - 2 * (x * x + y * y);
  return out;
}
function quatAxisAngle(ax, ang) {
  const s = Math.sin(ang / 2);
  return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(ang / 2)];
}

/**
 * Rotation extraction (Müller et al. 2016, "A Robust Method to Extract the
 * Rotational Part of Deformations"). A is column-major 3x3, Q holds a warm-
 * started quaternion at offset o which is refined in place.
 */
function extractRotation(A, Q, o, iters) {
  let x = Q[o], y = Q[o + 1], z = Q[o + 2], w = Q[o + 3];
  for (let it = 0; it < iters; it++) {
    const r00 = 1 - 2 * (y * y + z * z), r10 = 2 * (x * y + w * z), r20 = 2 * (x * z - w * y);
    const r01 = 2 * (x * y - w * z), r11 = 1 - 2 * (x * x + z * z), r21 = 2 * (y * z + w * x);
    const r02 = 2 * (x * z + w * y), r12 = 2 * (y * z - w * x), r22 = 1 - 2 * (x * x + y * y);
    let ox = (r10 * A[2] - r20 * A[1]) + (r11 * A[5] - r21 * A[4]) + (r12 * A[8] - r22 * A[7]);
    let oy = (r20 * A[0] - r00 * A[2]) + (r21 * A[3] - r01 * A[5]) + (r22 * A[6] - r02 * A[8]);
    let oz = (r00 * A[1] - r10 * A[0]) + (r01 * A[4] - r11 * A[3]) + (r02 * A[7] - r12 * A[6]);
    const den = Math.abs(r00 * A[0] + r10 * A[1] + r20 * A[2] + r01 * A[3] + r11 * A[4] + r21 * A[5] +
      r02 * A[6] + r12 * A[7] + r22 * A[8]) + 1e-9;
    ox /= den; oy /= den; oz /= den;
    const ang = Math.sqrt(ox * ox + oy * oy + oz * oz);
    if (ang < 1e-9) break;
    const s = Math.sin(ang * 0.5) / ang, c = Math.cos(ang * 0.5);
    const ax = ox * s, ay = oy * s, az = oz * s;
    const nx = c * x + ax * w + ay * z - az * y;
    const ny = c * y - ax * z + ay * w + az * x;
    const nz = c * z + ax * y - ay * x + az * w;
    const nw = c * w - ax * x - ay * y - az * z;
    const il = 1 / Math.hypot(nx, ny, nz, nw);
    x = nx * il; y = ny * il; z = nz * il; w = nw * il;
  }
  Q[o] = x; Q[o + 1] = y; Q[o + 2] = z; Q[o + 3] = w;
}

/** Column-major 4x4 matrices (WebGPU clip space: z in [0,1]). */
const mat4 = {
  perspective(fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), o = new Float32Array(16);
    o[0] = f / aspect; o[5] = f; o[10] = far / (near - far); o[11] = -1; o[14] = (near * far) / (near - far);
    return o;
  },
  ortho(l, r, b, t, n, f) {
    const o = new Float32Array(16);
    o[0] = 2 / (r - l); o[5] = 2 / (t - b); o[10] = 1 / (n - f);
    o[12] = (l + r) / (l - r); o[13] = (t + b) / (b - t); o[14] = n / (n - f); o[15] = 1;
    return o;
  },
  lookAt(eye, target, up) {
    const z = v3.norm(v3.sub(eye, target)), x = v3.norm(v3.cross(up, z)), y = v3.cross(z, x);
    return new Float32Array([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0,
      -v3.dot(x, eye), -v3.dot(y, eye), -v3.dot(z, eye), 1]);
  },
  mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    }
    return o;
  },
  invert(m) {
    const a00 = m[0], a01 = m[1], a02 = m[2], a03 = m[3], a10 = m[4], a11 = m[5], a12 = m[6], a13 = m[7];
    const a20 = m[8], a21 = m[9], a22 = m[10], a23 = m[11], a30 = m[12], a31 = m[13], a32 = m[14], a33 = m[15];
    const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10, b02 = a00 * a13 - a03 * a10;
    const b03 = a01 * a12 - a02 * a11, b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12;
    const b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30, b08 = a20 * a33 - a23 * a30;
    const b09 = a21 * a32 - a22 * a31, b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
    const det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
    const id = 1 / det, o = new Float32Array(16);
    o[0] = (a11 * b11 - a12 * b10 + a13 * b09) * id; o[1] = (a02 * b10 - a01 * b11 - a03 * b09) * id;
    o[2] = (a31 * b05 - a32 * b04 + a33 * b03) * id; o[3] = (a22 * b04 - a21 * b05 - a23 * b03) * id;
    o[4] = (a12 * b08 - a10 * b11 - a13 * b07) * id; o[5] = (a00 * b11 - a02 * b08 + a03 * b07) * id;
    o[6] = (a32 * b02 - a30 * b05 - a33 * b01) * id; o[7] = (a20 * b05 - a22 * b02 + a23 * b01) * id;
    o[8] = (a10 * b10 - a11 * b08 + a13 * b06) * id; o[9] = (a01 * b08 - a00 * b10 - a03 * b06) * id;
    o[10] = (a30 * b04 - a31 * b02 + a33 * b00) * id; o[11] = (a21 * b02 - a20 * b04 - a23 * b00) * id;
    o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * id; o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * id;
    o[14] = (a31 * b01 - a30 * b03 - a32 * b00) * id; o[15] = (a20 * b03 - a21 * b01 + a22 * b00) * id;
    return o;
  },
  xform(m, p) {
    const x = p[0], y = p[1], z = p[2];
    const w = m[3] * x + m[7] * y + m[11] * z + m[15];
    return [(m[0] * x + m[4] * y + m[8] * z + m[12]) / w, (m[1] * x + m[5] * y + m[9] * z + m[13]) / w,
      (m[2] * x + m[6] * y + m[10] * z + m[14]) / w];
  },
};

/** sRGB hex → linear [r,g,b]. */
function hexToLinear(hex) {
  const h = hex.replace('#', '');
  return [0, 2, 4].map((i) => Math.pow(parseInt(h.slice(i, i + 2), 16) / 255, 2.2));
}

/* ---------- 1. Signed-distance toolkit (used by species anatomy) ------- */
const SDF = {
  smin(a, b, k) { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k * 0.25; },
  smax(a, b, k) { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.max(a, b) + h * h * k * 0.25; },
  sphere(x, y, z, cx, cy, cz, r) { const dx = x - cx, dy = y - cy, dz = z - cz; return Math.sqrt(dx * dx + dy * dy + dz * dz) - r; },
  ellipsoid(x, y, z, cx, cy, cz, rx, ry, rz) {
    const px = x - cx, py = y - cy, pz = z - cz;
    const ax = px / rx, ay = py / ry, az = pz / rz, bx = ax / rx, by = ay / ry, bz = az / rz;
    const k0 = Math.sqrt(ax * ax + ay * ay + az * az), k1 = Math.sqrt(bx * bx + by * by + bz * bz);
    return k1 < 1e-9 ? -Math.min(rx, ry, rz) : (k0 * (k0 - 1)) / k1;
  },
  /** Capsule with radius interpolated from ra (at a) to rb (at b). */
  cone(x, y, z, a, b, ra, rb) {
    const bx = b[0] - a[0], by = b[1] - a[1], bz = b[2] - a[2];
    const px = x - a[0], py = y - a[1], pz = z - a[2];
    const t = clamp((px * bx + py * by + pz * bz) / (bx * bx + by * by + bz * bz), 0, 1);
    const qx = px - bx * t, qy = py - by * t, qz = pz - bz * t;
    return Math.sqrt(qx * qx + qy * qy + qz * qz) - (ra + (rb - ra) * t);
  },
  /** Exact 2D polygon distance (Inigo Quilez). pts is flat [u0,v0,u1,v1,...]. */
  polygon(u, v, pts) {
    const N = pts.length / 2;
    let d = (u - pts[0]) ** 2 + (v - pts[1]) ** 2, s = 1;
    for (let i = 0, j = N - 1; i < N; j = i, i++) {
      const vix = pts[2 * i], viy = pts[2 * i + 1], vjx = pts[2 * j], vjy = pts[2 * j + 1];
      const ex = vjx - vix, ey = vjy - viy, wx = u - vix, wy = v - viy;
      const t = clamp((wx * ex + wy * ey) / (ex * ex + ey * ey), 0, 1);
      const bx = wx - ex * t, by = wy - ey * t;
      d = Math.min(d, bx * bx + by * by);
      const c1 = v >= viy, c2 = v < vjy, c3 = ex * wy > ey * wx;
      if ((c1 && c2 && c3) || (!c1 && !c2 && !c3)) s = -s;
    }
    return s * Math.sqrt(d);
  },
  /** Rounded extrusion of a 2D distance d2 along w with half thickness h. */
  extrude(d2, w, h, r) {
    const qx = d2 + r, qy = Math.abs(w) - h + r;
    const mx = qx > 0 ? qx : 0, my = qy > 0 ? qy : 0;
    return Math.min(Math.max(qx, qy), 0) + Math.sqrt(mx * mx + my * my) - r;
  },
  /** Orthonormal frame for planar shapes: u (in-plane), v (in-plane), w (normal). */
  frame(origin, uDir, vDir) {
    const v = v3.norm(vDir);
    const u = v3.norm(v3.sub(uDir, v3.scale(v, v3.dot(uDir, v))));
    return { o: origin, u, v, w: v3.cross(u, v) };
  },
  /** Puffy planar appendage: polygon in a frame, extruded with a pillow taper toward its edges. */
  planar(x, y, z, F, poly, h, round, taper) {
    const dx = x - F.o[0], dy = y - F.o[1], dz = z - F.o[2];
    const w = dx * F.w[0] + dy * F.w[1] + dz * F.w[2];
    if (Math.abs(w) > h + 0.25) return Math.abs(w) - h;
    const u = dx * F.u[0] + dy * F.u[1] + dz * F.u[2];
    const v = dx * F.v[0] + dy * F.v[1] + dz * F.v[2];
    const d2 = SDF.polygon(u, v, poly);
    const hh = taper > 0 ? h * (0.4 + 0.6 * smoothstep(0, taper, -d2)) : h;
    return SDF.extrude(d2, w, hh, Math.min(round, hh * 0.92));
  },
};

/* ---------- 2. Procedural geometry: surface nets ----------------------- */
const CUBE_EDGES = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];

/**
 * Naive surface nets over a sampled SDF. A coarse pre-pass skips exact
 * evaluation far from the surface. Vertices are then projected onto the
 * zero set and given analytic-gradient normals.
 */
function surfaceNets(fn, bmin, bmax, h) {
  const nx = Math.ceil((bmax[0] - bmin[0]) / h) + 1, ny = Math.ceil((bmax[1] - bmin[1]) / h) + 1;
  const nz = Math.ceil((bmax[2] - bmin[2]) / h) + 1, sy = nx, sz = nx * ny;
  const val = new Float32Array(nx * ny * nz);
  const C = 4, cnx = Math.ceil((nx - 1) / C) + 1, cny = Math.ceil((ny - 1) / C) + 1, cnz = Math.ceil((nz - 1) / C) + 1;
  const cval = new Float32Array(cnx * cny * cnz);
  for (let k = 0; k < cnz; k++) for (let j = 0; j < cny; j++) for (let i = 0; i < cnx; i++) {
    cval[i + cnx * (j + cny * k)] = fn(bmin[0] + i * C * h, bmin[1] + j * C * h, bmin[2] + k * C * h);
  }
  const thr = 1.6 * C * h;
  for (let k = 0; k < nz; k++) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const dc = cval[Math.round(i / C) + cnx * (Math.round(j / C) + cny * Math.round(k / C))];
    val[i + sy * j + sz * k] = Math.abs(dc) > thr ? dc : fn(bmin[0] + i * h, bmin[1] + j * h, bmin[2] + k * h);
  }
  const cx = nx - 1, cy = ny - 1;
  const cubeId = (i, j, k) => i + cx * (j + cy * k);
  const vid = new Int32Array(cx * cy * (nz - 1)).fill(-1);
  const pos = [], cv = new Float32Array(8);
  for (let k = 0; k < nz - 1; k++) for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
    let mask = 0;
    for (let c = 0; c < 8; c++) {
      const v = val[(i + (c & 1)) + sy * (j + ((c >> 1) & 1)) + sz * (k + (c >> 2))];
      cv[c] = v; if (v < 0) mask |= 1 << c;
    }
    if (mask === 0 || mask === 255) continue;
    let ax = 0, ay = 0, az = 0, cnt = 0;
    for (const [a, b] of CUBE_EDGES) {
      if (((mask >> a) & 1) === ((mask >> b) & 1)) continue;
      const t = cv[a] / (cv[a] - cv[b]);
      ax += (a & 1) + t * ((b & 1) - (a & 1));
      ay += ((a >> 1) & 1) + t * (((b >> 1) & 1) - ((a >> 1) & 1));
      az += (a >> 2) + t * ((b >> 2) - (a >> 2));
      cnt++;
    }
    vid[cubeId(i, j, k)] = pos.length / 3;
    pos.push(bmin[0] + (i + ax / cnt) * h, bmin[1] + (j + ay / cnt) * h, bmin[2] + (k + az / cnt) * h);
  }
  const idx = [];
  const quad = (a, b, c, d) => {
    if (a < 0 || b < 0 || c < 0 || d < 0) return;
    const dac = (pos[3 * a] - pos[3 * c]) ** 2 + (pos[3 * a + 1] - pos[3 * c + 1]) ** 2 + (pos[3 * a + 2] - pos[3 * c + 2]) ** 2;
    const dbd = (pos[3 * b] - pos[3 * d]) ** 2 + (pos[3 * b + 1] - pos[3 * d + 1]) ** 2 + (pos[3 * b + 2] - pos[3 * d + 2]) ** 2;
    if (dac < dbd) idx.push(a, b, c, a, c, d); else idx.push(a, b, d, b, c, d);
  };
  for (let k = 1; k < nz - 1; k++) for (let j = 1; j < ny - 1; j++) for (let i = 1; i < nx - 1; i++) {
    const v0 = val[i + sy * j + sz * k], in0 = v0 < 0;
    if (in0 !== (val[i + 1 + sy * j + sz * k] < 0)) {
      const a = vid[cubeId(i, j - 1, k - 1)], b = vid[cubeId(i, j, k - 1)], c = vid[cubeId(i, j, k)], d = vid[cubeId(i, j - 1, k)];
      if (in0) quad(a, b, c, d); else quad(d, c, b, a);
    }
    if (in0 !== (val[i + sy * (j + 1) + sz * k] < 0)) {
      const a = vid[cubeId(i - 1, j, k - 1)], b = vid[cubeId(i - 1, j, k)], c = vid[cubeId(i, j, k)], d = vid[cubeId(i, j, k - 1)];
      if (in0) quad(a, b, c, d); else quad(d, c, b, a);
    }
    if (in0 !== (val[i + sy * j + sz * (k + 1)] < 0)) {
      const a = vid[cubeId(i - 1, j - 1, k)], b = vid[cubeId(i, j - 1, k)], c = vid[cubeId(i, j, k)], d = vid[cubeId(i - 1, j, k)];
      if (in0) quad(a, b, c, d); else quad(d, c, b, a);
    }
  }
  const P = new Float32Array(pos), N = new Float32Array(pos.length);
  const e = h * 0.25;
  const grad = (x, y, z, out) => { // tetrahedral gradient (4 evaluations)
    const a = fn(x + e, y - e, z - e), b = fn(x - e, y - e, z + e), c = fn(x - e, y + e, z - e), d = fn(x + e, y + e, z + e);
    out[0] = a - b - c + d; out[1] = -a - b + c + d; out[2] = -a + b - c + d;
  };
  const g = [0, 0, 0];
  for (let v = 0; v < P.length; v += 3) {
    let x = P[v], y = P[v + 1], z = P[v + 2];
    grad(x, y, z, g);
    for (let it = 0; it < 2; it++) { // Newton projection onto the zero set: ∇f ≈ g / 4e
      const gl = Math.hypot(g[0], g[1], g[2]);
      if (gl < 1e-12) break;
      const s = clamp((fn(x, y, z) * 4 * e) / gl, -h * 0.6, h * 0.6);
      x -= (g[0] / gl) * s; y -= (g[1] / gl) * s; z -= (g[2] / gl) * s;
      grad(x, y, z, g);
    }
    const l2 = Math.hypot(g[0], g[1], g[2]) || 1;
    P[v] = x; P[v + 1] = y; P[v + 2] = z;
    N[v] = g[0] / l2; N[v + 1] = g[1] / l2; N[v + 2] = g[2] / l2;
  }
  return { positions: P, normals: N, indices: new Uint32Array(idx) };
}

/** March from `from` along `dir` and bisect to the first zero crossing of fn. */
function surfacePoint(fn, from, dir, maxDist = 2, step = 0.01) {
  const d = v3.norm(dir);
  let prev = fn(from[0], from[1], from[2]), t0 = 0;
  for (let t = step; t <= maxDist; t += step) {
    const p = [from[0] + d[0] * t, from[1] + d[1] * t, from[2] + d[2] * t];
    const cur = fn(p[0], p[1], p[2]);
    if ((prev < 0) !== (cur < 0)) {
      let a = t0, b = t;
      for (let i = 0; i < 24; i++) {
        const m = (a + b) / 2, fm = fn(from[0] + d[0] * m, from[1] + d[1] * m, from[2] + d[2] * m);
        if ((fm < 0) === (prev < 0)) a = m; else b = m;
      }
      const m = (a + b) / 2;
      return [from[0] + d[0] * m, from[1] + d[1] * m, from[2] + d[2] * m];
    }
    prev = cur; t0 = t;
  }
  return null;
}

/* ---------- 3. Soft body: lattice construction + XPBD solver ----------- */
/**
 * Builds a hexahedral lattice that covers the SDF interior and every render
 * vertex. Each hex gets 8 shared particles, a fill fraction (for mass and
 * volume read-outs), a stiffness multiplier from the species' stuffing
 * distribution, and a 5-tet split for volume constraints.
 */
function buildLattice(fn, verts, H, stuffingAt) {
  let mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
  for (let i = 0; i < verts.length; i += 3) for (let a = 0; a < 3; a++) {
    mn[a] = Math.min(mn[a], verts[i + a]); mx[a] = Math.max(mx[a], verts[i + a]);
  }
  const origin = mn.map((m) => m - H * 0.5);
  const dims = [0, 1, 2].map((a) => Math.ceil((mx[a] - origin[a]) / H + 0.5));
  const [cx, cy, cz] = dims;
  const cid = (i, j, k) => i + cx * (j + cy * k);
  const active = new Uint8Array(cx * cy * cz);
  for (let k = 0; k < cz; k++) for (let j = 0; j < cy; j++) for (let i = 0; i < cx; i++) {
    if (fn(origin[0] + (i + 0.5) * H, origin[1] + (j + 0.5) * H, origin[2] + (k + 0.5) * H) < -H * 0.05) active[cid(i, j, k)] = 1;
  }
  const cellOfPoint = (x, y, z) => [
    clamp(Math.floor((x - origin[0]) / H), 0, cx - 1), clamp(Math.floor((y - origin[1]) / H), 0, cy - 1),
    clamp(Math.floor((z - origin[2]) / H), 0, cz - 1)];
  for (let v = 0; v < verts.length; v += 3) {
    const [i, j, k] = cellOfPoint(verts[v], verts[v + 1], verts[v + 2]);
    active[cid(i, j, k)] = 1;
  }
  const px = cx + 1, py = cy + 1;
  const pid = new Int32Array(px * py * (cz + 1)).fill(-1);
  const rest = [], cells = [], cellOf = new Int32Array(cx * cy * cz).fill(-1), cellIJK = [];
  for (let k = 0; k < cz; k++) for (let j = 0; j < cy; j++) for (let i = 0; i < cx; i++) {
    if (!active[cid(i, j, k)]) continue;
    cellOf[cid(i, j, k)] = cells.length / 8;
    cellIJK.push(i, j, k);
    for (let c = 0; c < 8; c++) {
      const ci = i + (c & 1), cj = j + ((c >> 1) & 1), ck = k + (c >> 2), key = ci + px * (cj + py * ck);
      if (pid[key] < 0) { pid[key] = rest.length / 3; rest.push(origin[0] + ci * H, origin[1] + cj * H, origin[2] + ck * H); }
      cells.push(pid[key]);
    }
  }
  const n = rest.length / 3, nc = cells.length / 8;
  const fill = new Float32Array(nc), stiff = new Float32Array(nc), mass = new Float64Array(n);
  for (let c = 0; c < nc; c++) {
    const i = cellIJK[3 * c], j = cellIJK[3 * c + 1], k = cellIJK[3 * c + 2];
    let inside = 0;
    for (let s = 0; s < 27; s++) {
      const x = origin[0] + (i + ((s % 3) + 0.5) / 3) * H, y = origin[1] + (j + ((((s / 3) | 0) % 3) + 0.5) / 3) * H;
      const z = origin[2] + (k + (((s / 9) | 0) + 0.5) / 3) * H;
      if (fn(x, y, z) < 0) inside++;
    }
    fill[c] = Math.max(inside / 27, 0.06);
    const ccx = origin[0] + (i + 0.5) * H, ccy = origin[1] + (j + 0.5) * H, ccz = origin[2] + (k + 0.5) * H;
    const st = stuffingAt ? stuffingAt(ccx, ccy, ccz) : { density: 1, stiffness: 1 };
    stiff[c] = st.stiffness;
    for (let q = 0; q < 8; q++) mass[cells[8 * c + q]] += (fill[c] * st.density) / 8;
  }
  const surfOff = new Float32Array(n);
  for (let p = 0; p < n; p++) surfOff[p] = clamp(fn(rest[3 * p], rest[3 * p + 1], rest[3 * p + 2]), 0, H);
  // 5-tet split, alternating parity so neighbouring hexes share face diagonals.
  const TA = [[1, 2, 4, 7], [0, 1, 2, 4], [3, 1, 7, 2], [5, 1, 4, 7], [6, 2, 7, 4]];
  const TB = [[0, 3, 5, 6], [1, 0, 5, 3], [2, 0, 3, 6], [4, 0, 6, 5], [7, 3, 6, 5]];
  const tets = [];
  for (let c = 0; c < nc; c++) {
    const par = (cellIJK[3 * c] + cellIJK[3 * c + 1] + cellIJK[3 * c + 2]) & 1;
    for (const t of par ? TB : TA) tets.push(cells[8 * c + t[0]], cells[8 * c + t[1]], cells[8 * c + t[2]], cells[8 * c + t[3]]);
  }
  // Unique edges for the debug overlay.
  const edgeSet = new Set(), edges = [];
  for (let c = 0; c < nc; c++) for (const [a, b] of CUBE_EDGES) {
    const p = cells[8 * c + a], q = cells[8 * c + b], key = Math.min(p, q) * n + Math.max(p, q);
    if (!edgeSet.has(key)) { edgeSet.add(key); edges.push(p, q); }
  }
  /** Embed a rest-space point: returns containing cell and trilinear coordinates. */
  function embed(x, y, z) {
    let [i, j, k] = cellOfPoint(x, y, z);
    let c = cellOf[cid(i, j, k)];
    if (c < 0) { // nearest active cell (only happens for anchors outside the lattice)
      let best = Infinity;
      for (let q = 0; q < nc; q++) {
        const d = (origin[0] + (cellIJK[3 * q] + 0.5) * H - x) ** 2 + (origin[1] + (cellIJK[3 * q + 1] + 0.5) * H - y) ** 2 +
          (origin[2] + (cellIJK[3 * q + 2] + 0.5) * H - z) ** 2;
        if (d < best) { best = d; c = q; }
      }
      i = cellIJK[3 * c]; j = cellIJK[3 * c + 1]; k = cellIJK[3 * c + 2];
    }
    return { cell: c, u: (x - origin[0]) / H - i, v: (y - origin[1]) / H - j, w: (z - origin[2]) / H - k };
  }
  return { H, origin, dims, n, nc, rest: new Float64Array(rest), cells: new Int32Array(cells), fill, stiff, mass,
    surfOff, tets: new Int32Array(tets), edges: new Uint32Array(edges), embed };

/* ---------- 4. Locomotion capabilities --------------------------------- */
/**
 * A locomotion capability turns a behaviour "intent" into (a) a posed rest
 * shape for the lattice (active muscles: shape matching pulls the body toward
 * it) and (b) velocity-level forces (thrust, torques, drag). Species pick one
 * by name and tune it through their definition.
 */
const Locomotion = {
  registry: {},
  register(type, factory) { this.registry[type] = factory; },
  create(type, creature, cfg) {
    const f = this.registry[type];
    if (!f) throw new Error(`Unknown locomotion capability "${type}"`);
    return f(creature, cfg);
  },
};

/** Shared helper: distribute an angular acceleration α about c as particle velocity change. */
function applySpin(sim, alpha, sdt) {
  const x = sim.x, v = sim.v, c = sim.frame.c, ax = alpha[0] * sdt, ay = alpha[1] * sdt, az = alpha[2] * sdt;
  for (let p = 0; p < x.length; p += 3) {
    const rx = x[p] - c[0], ry = x[p + 1] - c[1], rz = x[p + 2] - c[2];
    v[p] += ay * rz - az * ry; v[p + 1] += az * rx - ax * rz; v[p + 2] += ax * ry - ay * rx;
  }
}

/** Keep a target point inside the environment bounds. */
function clampToBounds(p, b, m) {
  return [clamp(p[0], b.min[0] + m, b.max[0] - m), clamp(p[1], b.min[1] + m * 0.4, b.max[1] - m * 0.6), clamp(p[2], b.min[2] + m, b.max[2] - m)];
}

/**
 * SWIM — travelling-wave undulation along a spine (+x = head in rest space).
 * Thrust is partly emergent (anisotropic drag on the undulating lattice) and
 * partly an explicit propulsive force scaled by beat frequency.
 */

  const ctrl = { alpha: [0, 0, 0], thrust: [0, 0, 0] };
  const k = (2 * Math.PI) / (cfg.waveLength * L);

    params,
    defaultIntent: () => ({ target: null, speed: 0.6, beat: 1, amplitude: 1, turnBend: 1, headYaw: 0, wriggle: 0 }),
    pose(dt, intent, posed) {
      time += dt;
      const tf = cfg.baseFreq * params.beat * intent.beat;
      freq += (tf - freq) * damp(4, dt);
      phase += 2 * Math.PI * freq * dt;
      amp += (intent.amplitude - amp) * damp(5, dt);
      headYaw += (intent.headYaw - headYaw) * damp(7, dt);
      wrig += (intent.wriggle - wrig) * damp(8, dt);
      wrigPhase += 2 * Math.PI * cfg.wriggleFreq * dt;
      let x = headX, z = 0;
      for (let i = 0; i < NS; i++) {
        const s = i * ds, sig = s / L;
        const A = (cfg.amp[0] + cfg.amp[1] * sig + cfg.amp[2] * sig * sig) * amp;
        let t = A * Math.sin(phase - k * s);
        t -= bend * cfg.turnBend * sig;
        t += headYaw * (1 - smoothstep(0, cfg.neck, s));
        t += wrig * cfg.wriggleAmp * Math.sin(wrigPhase - 9 * sig) * (0.35 + sig);
        th[i] = t;
        if (i > 0) { const tm = 0.5 * (th[i] + th[i - 1]); x -= Math.cos(tm) * ds; z += Math.sin(tm) * ds; }
        sx[i] = x; sz[i] = z;
      }
      for (let p = 0; p < n; p++) {
        const rx = rest[3 * p], ry = rest[3 * p + 1], rz = rest[3 * p + 2];
        const s = headX - rx, sc = clamp(s, 0, L), f = (sc / L) * (NS - 1), i0 = Math.min(Math.floor(f), NS - 2), a = f - i0;
        const X = sx[i0] + (sx[i0 + 1] - sx[i0]) * a, Z = sz[i0] + (sz[i0 + 1] - sz[i0]) * a, T = th[i0] + (th[i0 + 1] - th[i0]) * a;
        const c = Math.cos(T), sn = Math.sin(T), e = s - sc;

      }
    },
    control(dt, intent) {
      const F = sim.frame, f = F.f, u = F.u, l = F.l, c = F.c, w = F.omega;
      const head = [c[0] + f[0] * cfg.headOffset, c[1] + f[1] * cfg.headOffset, c[2] + f[2] * cfg.headOffset];
      const tgt = clampToBounds(intent.target || v3.add(head, v3.scale(f, 2)), env.bounds, cfg.wallMargin);
      const to = v3.sub(tgt, head), dh = Math.hypot(to[0], to[2]);
      const err = dh > 0.05 ? wrapAngle(Math.atan2(-to[2], to[0]) - Math.atan2(-f[2], f[0])) : 0;
      const ay = clamp(cfg.turnGain * err - cfg.turnDamp * w[1], -cfg.maxTurn, cfg.maxTurn);
      bend += (clamp(err * 1.1, -1, 1) * intent.turnBend - bend) * damp(3, dt);
      const pitch = Math.asin(clamp(f[1], -1, 1));
      const pitchDes = clamp(Math.atan2(to[1], Math.max(dh, 0.5)), -cfg.maxPitch, cfg.maxPitch);
      const ap = cfg.pitchGain * (pitchDes - pitch) - cfg.pitchDamp * v3.dot(w, l);
      const rollAxis = v3.cross(u, [0, 1, 0]);
      const ar = cfg.rollGain * v3.dot(rollAxis, f) - cfg.rollDamp * v3.dot(w, f);
      ctrl.alpha = [l[0] * ap + f[0] * ar, ay + l[1] * ap + f[1] * ar, l[2] * ap + f[2] * ar];
      // Thrust grows with beat frequency and eases off while the target is off-axis, tightening turns.
      const th0 = cfg.thrust * intent.speed * Math.sqrt(freq / cfg.baseFreq) * clamp(0.35 + 0.65 * Math.cos(err), 0.15, 1);
      // Pectoral lift / buoyancy trim: a bounded vertical force toward the target depth.
      const lift = clamp((tgt[1] - c[1]) * cfg.liftGain - F.v[1] * cfg.liftDamp, -cfg.maxLift, cfg.maxLift);
      ctrl.thrust = [f[0] * th0, f[1] * th0 + lift, f[2] * th0];

    applyForces(sdt) {
      const x = sim.x, v = sim.v, F = sim.frame, f = F.f, u = F.u, l = F.l, T = ctrl.thrust, c0 = F.c;
      const wx = ctrl.alpha[0] * sdt, wy = ctrl.alpha[1] * sdt, wz = ctrl.alpha[2] * sdt;
      const ct = 1 - 1 / (1 + cfg.drag[0] * sdt), cn = 1 - 1 / (1 + cfg.drag[1] * sdt), cu = 1 - 1 / (1 + cfg.drag[2] * sdt);
      for (let p = 0; p < n; p++) {
        const i = 3 * p;
        const rx = x[i] - c0[0], ry = x[i + 1] - c0[1], rz = x[i + 2] - c0[2];
        v[i] += T[0] * sdt + wy * rz - wz * ry; v[i + 1] += T[1] * sdt + wz * rx - wx * rz; v[i + 2] += T[2] * sdt + wx * ry - wy * rx;

        const nx = f[0] * sn + l[0] * cs, ny = f[1] * sn + l[1] * cs, nz = f[2] * sn + l[2] * cs;
        const vt = (v[i] * tx + v[i + 1] * ty + v[i + 2] * tz) * ct;
        const vn = (v[i] * nx + v[i + 1] * ny + v[i + 2] * nz) * cn;
        const vu = (v[i] * u[0] + v[i + 1] * u[1] + v[i + 2] * u[2]) * cu;
        v[i] -= tx * vt + nx * vn + u[0] * vu; v[i + 1] -= ty * vt + ny * vn + u[1] * vu; v[i + 2] -= tz * vt + nz * vn + u[2] * vu;
      }
    },
    readouts: { get beatsPerMinute() { return freq * 60; }, get speed() { return sim.frame.speed; } },
    reset() { phase = 0; freq = cfg.baseFreq; bend = 0; headYaw = 0; wrig = 0; amp = 1; },
  };
});

/**
 * HOP — ground locomotion with crouch / launch / flight / landing phases.
 * Squash-and-stretch is posed into the lattice rest shape; the jump itself is
 * a ballistic impulse under gravity, and floppy parts react physically.
 */
Locomotion.register('hop', (creature, cfg) => {
  const sim = creature.sim, n = sim.n, rest = sim.lat.rest, env = creature.env;
  const params = { hopHeight: 1 };
  let phase = 'ground', timer = 0, crouch = 0, air = 0, cooldown = 0.5, hops = 0, sniffPh = 0, twist = 0, impulse = null;
  let alpha = [0, 0, 0], plannedScale = 1;
  const com = sim.restCom;
  return {
    params,
    defaultIntent: () => ({ target: null, hop: false, hopNow: false, hopScale: 1, sniff: 0, twist: 0, crouch: 0, turn: true }),
    pose(dt, intent, posed) {
      const cTarget = phase === 'crouch' ? 1 : intent.crouch;
      crouch += (cTarget - crouch) * damp(phase === 'crouch' ? 18 : 6, dt);
      const stretch = phase === 'air' ? Math.max(0, 1 - air * 2.2) : 0;
      twist += ((phase === 'air' ? intent.twist : 0) - twist) * damp(10, dt);
      sniffPh += dt * 2 * Math.PI * 7;
      const sy = 1 - cfg.squash * crouch + cfg.stretch * stretch, sxz = 1 + cfg.squash * 0.45 * crouch - cfg.stretch * 0.3 * stretch;
      for (let p = 0; p < n; p++) {
        const rx = rest[3 * p], ry = rest[3 * p + 1], rz = rest[3 * p + 2];
        let x = com[0] + (rx - com[0]) * sxz, y = cfg.groundY + (ry - cfg.groundY) * sy, z = com[2] + (rz - com[2]) * sxz;
        const hw = smoothstep(cfg.headX - 0.05, cfg.headX + 0.12, rx);
        y += Math.sin(sniffPh) * 0.012 * intent.sniff * hw;
        const tw = twist * 0.55 * smoothstep(com[0] + 0.05, com[0] - 0.3, rx);
        if (tw !== 0) { const c = Math.cos(tw), s = Math.sin(tw), yy = y - com[1]; y = com[1] + yy * c - z * s; z = yy * s + z * c; }
        posed[3 * p] = x; posed[3 * p + 1] = y; posed[3 * p + 2] = z;
      }
    },
    control(dt, intent) {
      const F = sim.frame, f = F.f, u = F.u, c = F.c, w = F.omega, g = Math.abs(env.cfg.gravity) * (1 - env.cfg.buoyancy);
      const grounded = sim.contacts > 0;
      cooldown -= dt;
      const tgt = intent.target ? clampToBounds(intent.target, env.bounds, cfg.wallMargin) : null;
      const to = tgt ? v3.sub(tgt, c) : [f[0], 0, f[2]], dh = Math.hypot(to[0], to[2]);
      const err = dh > 0.05 ? wrapAngle(Math.atan2(-to[2], to[0]) - Math.atan2(-f[2], f[0])) : 0;
      const ay = grounded && intent.turn ? clamp(cfg.turnGain * err - cfg.turnDamp * w[1], -cfg.maxTurn, cfg.maxTurn) : -w[1] * 0.5;
      const rollAxis = v3.cross(u, [0, 1, 0]);
      alpha = [rollAxis[0] * cfg.uprightGain - (w[0]) * cfg.uprightDamp, ay, rollAxis[2] * cfg.uprightGain - (w[2]) * cfg.uprightDamp];
      if (phase === 'ground') {
        const wants = intent.hopNow || (intent.hop && tgt && dh > 0.3);
        if (grounded && wants && cooldown <= 0 && (intent.hopNow || Math.abs(err) < 0.6)) { phase = 'crouch'; timer = cfg.crouchTime; plannedScale = intent.hopScale; }
      } else if (phase === 'crouch') {
        timer -= dt;
        if (timer <= 0) {
          const h = cfg.hopHeight * params.hopHeight * plannedScale, vy = Math.sqrt(2 * g * h), tAir = (2 * vy) / g;
          const dist = Math.min(tgt ? dh : cfg.hopDistance, cfg.hopDistance * plannedScale), hs = dist / tAir;
          const dir = v3.norm([f[0], 0, f[2]]);
          impulse = [dir[0] * hs, vy, dir[2] * hs]; phase = 'air'; air = 0; hops++;
        }
      } else if (phase === 'air') {
        air += dt;
        if (grounded && air > 0.15) { phase = 'ground'; cooldown = cfg.cooldown; }
        if (air > 3) phase = 'ground';
      }
    },
    applyForces(sdt, s) {
      applySpin(sim, alpha, sdt);
      if (impulse && s === 0) {
        const v = sim.v;
        for (let p = 0; p < v.length; p += 3) { v[p] += impulse[0]; v[p + 1] += impulse[1]; v[p + 2] += impulse[2]; }
        impulse = null;
      }
    },
    readouts: { get hops() { return hops; }, get phase() { return phase; }, get airborne() { return phase === 'air'; } },
    reset() { phase = 'ground'; timer = 0; crouch = 0; cooldown = 0.5; hops = 0; impulse = null; },
  };
});

/* ---------- 5. Behaviour engine ---------------------------------------- */
/**
 * Prioritised finite-state machine. Each state declares its kind
 * (autonomous | user | reactive | environment), priority, whether it can be
 * interrupted, whether it resumes after an interruption, and optional
 * enter / update / exit / trigger / retrigger hooks. States write into the
 * per-tick `ctx.intent`, which locomotion and expression systems consume.
 */
class BehaviorMachine {
  constructor(def, ctx) {
    this.def = def; this.ctx = ctx; this.stack = []; this.history = [];
    this.ids = Object.keys(def.states);
    this.triggered = this.ids.filter((id) => def.states[id].trigger).sort((a, b) => def.states[b].priority - def.states[a].priority);
    this.current = null;
    this.enter(def.initial, null, 'start');
  }
  get state() { return this.current; }
  label(id = this.current.id) { return this.def.states[id].label || id; }
  canPreempt(def) {
    const cur = this.current.def;
    if (cur.interruptible === false && def.priority <= (cur.lockPriority ?? 99)) return false;
    return def.priority > cur.priority;
  }
  enter(id, payload, reason) {
    const def = this.def.states[id];
    if (!def) throw new Error(`Unknown behaviour "${id}"`);
    const prev = this.current;
    if (prev) {
      if (prev.def.resumable && reason !== 'next' && reason !== 'done') {
        this.stack = this.stack.filter((s) => s.id !== prev.id);
        this.stack.push(prev);
        if (this.stack.length > 4) { const old = this.stack.shift(); old.def.exit?.(this.ctx, old.data); }
      } else prev.def.exit?.(this.ctx, prev.data);
    }
    this.stack = this.stack.filter((s) => s.id !== id);
    this.current = { id, def, data: {}, time: 0 };
    this.history.unshift({ id, reason, t: this.ctx.time });
    if (this.history.length > 8) this.history.pop();
    def.enter?.(this.ctx, this.current.data, payload);
    return true;
  }
  /** User-triggered request (buttons). */
  request(id, payload) {
    if (this.current.id === id) { this.current.def.retrigger?.(this.ctx, this.current.data, payload); return true; }
    if (!this.canPreempt(this.def.states[id])) return false;
    return this.enter(id, payload, 'user');
  }
  /** Reactive event (touch, grab, comb). Re-triggering an active reaction extends it. */
  react(id, payload) {
    if (this.current.id === id) { this.current.def.retrigger?.(this.ctx, this.current.data, payload); return true; }
    if (!this.canPreempt(this.def.states[id])) return false;
    return this.enter(id, payload, 'reaction');
  }
  cancel(id) {
    this.stack = this.stack.filter((s) => s.id !== id);
    if (this.current.id === id) this.finish(null);
  }
  finish(next) {
    const cur = this.current;
    cur.def.exit?.(this.ctx, cur.data);
    this.current = null;
    if (next) { this.enterFresh(next.id, next.payload, 'next'); return; }
    if (this.stack.length) {
      this.current = this.stack.pop();
      this.history.unshift({ id: this.current.id, reason: 'resume', t: this.ctx.time });
      this.current.def.resume?.(this.ctx, this.current.data);
    } else this.enterFresh(this.def.initial, null, 'done');
  }
  enterFresh(id, payload, reason) { this.current = null; this.enter(id, payload, reason); }
  tick(dt) {
    const ctx = this.ctx;
    for (const id of this.triggered) {
      const d = this.def.states[id];
      if (id === this.current.id || this.stack.some((s) => s.id === id)) continue;
      if (this.canPreempt(d) && d.trigger(ctx)) { this.enter(id, null, d.kind); break; }
    }
    const cur = this.current;
    cur.time += dt;
    let r = cur.def.update ? cur.def.update(ctx, cur.data, dt, cur.time) : undefined;
    if (r === undefined && cur.def.duration && cur.time >= cur.def.duration) r = 'done';
    if (r === 'done') this.finish(null);
    else if (r && r.next) this.finish({ id: r.next, payload: r.payload });
  }
  reset() { this.stack = []; this.history = []; this.current = null; this.enter(this.def.initial, null, 'reset'); }
}

/* ---------- 6. Environment & props ------------------------------------- */
/** Environment presets are engine-level; species choose one and may override fields. */
const ENVIRONMENTS = {
  tank: { label: 'Studio tank', medium: 'water', gravity: -28, buoyancy: 1, friction: 0.15, floorPattern: 'caustics',
    bounds: { min: [-3.4, 0, -2.5], max: [3.4, 2.6, 2.5] }, background: '#d8d2c8', floor: '#cdc3b1', fadeRadius: 11 },
  studio: { label: 'Felt studio', medium: 'air', gravity: -28, buoyancy: 0, friction: 0.55, floorPattern: 'felt',
    bounds: { min: [-3, 0, -2.2], max: [3, 3.4, 2.2] }, background: '#d9d3ca', floor: '#c9bfae', fadeRadius: 10 },
};

class Environment {
  constructor(cfg, itemDefs, rng) {
    this.cfg = cfg; this.itemDefs = itemDefs || {}; this.rng = rng;
    this.bounds = cfg.bounds; this.friction = cfg.friction; this.items = []; this.nextId = 1; this.time = 0;
    const self = this;
    this.api = {
      get bounds() { return self.bounds; },
      get floorY() { return self.bounds.min[1]; },
      get medium() { return self.cfg.medium; },
      items: (type) => self.items.filter((it) => it.state === 'active' && (!type || it.type === type)),
      count: (type) => self.items.filter((it) => !type || it.type === type).length,
      spawn: (type, opts) => self.spawn(type, opts),
      nearest: (type, p) => {
        let best = null, bd = Infinity;
        for (const it of self.items) if (it.type === type && it.state === 'active') {
          const d = v3.dist(it.pos, p); if (d < bd) { bd = d; best = it; }
        }
        return best;
      },
      attract: (it, p, rate, dt) => { const k = damp(rate, dt); for (let a = 0; a < 3; a++) it.pos[a] += (p[a] - it.pos[a]) * k; it.vel = [0, 0, 0]; },
      consume: (it, p) => { it.state = 'consumed'; it.sink = p.slice(); },
      randomPoint: (margin = 0.8, yRange = [0.4, 0.8]) => {
        const b = self.bounds, r = self.rng;
        return [lerp(b.min[0] + margin, b.max[0] - margin, r()), lerp(b.min[1], b.max[1], lerp(yRange[0], yRange[1], r())),
          lerp(b.min[2] + margin, b.max[2] - margin, r())];
      },
      get center() { const b = self.bounds; return [(b.min[0] + b.max[0]) / 2, (b.min[1] + b.max[1]) / 2, (b.min[2] + b.max[2]) / 2]; },
    };
  }
  spawn(type, opts = {}) {
    const def = this.itemDefs[type];
    if (!def) throw new Error(`Unknown item type "${type}"`);
    const it = { id: this.nextId++, type, def, pos: (opts.pos || this.api.randomPoint(1.0, [0.85, 0.9])).slice(), vel: [0, 0, 0],
      yaw: this.rng() * Math.PI * 2, spin: (this.rng() - 0.5) * 2, t: 0, scale: 1, state: 'active' };
    this.items.push(it);
    return it;
  }
  step(dt) {
    this.time += dt;
    const g = this.cfg.gravity, floor = this.bounds.min[1];
    for (const it of this.items) {
      it.t += dt;
      if (it.state === 'consumed') {
        for (let a = 0; a < 3; a++) it.pos[a] += (it.sink[a] - it.pos[a]) * damp(14, dt);
        it.scale -= dt * 5;
        continue;
      }
      const b = this.cfg.medium === 'water' ? it.def.buoyancy : 0;
      it.vel[1] += g * (1 - b) * dt;
      const drag = this.cfg.medium === 'water' ? it.def.drag : 0.1;
      for (let a = 0; a < 3; a++) it.vel[a] *= Math.exp(-drag * dt);
      it.vel[0] += Math.sin(it.t * 3.1 + it.id) * dt * 0.4 * (it.pos[1] > floor + it.def.radius + 0.05 ? 1 : 0);
      for (let a = 0; a < 3; a++) it.pos[a] += it.vel[a] * dt;
      if (it.pos[1] < floor + it.def.radius) { it.pos[1] = floor + it.def.radius; it.vel[1] = 0; it.vel[0] *= 0.8; it.vel[2] *= 0.8; it.landed = true; }
      if (!it.landed) it.yaw += it.spin * dt;
    }
    this.items = this.items.filter((it) => it.scale > 0);
  }
  clear() { this.items = []; }
  /** Model matrix for an item (yaw, flutter tilt, uniform scale). */
  itemMatrix(it) {
    const s = Math.max(it.scale, 0) * (it.def.scale || 1), cy = Math.cos(it.yaw), sy = Math.sin(it.yaw);
    const tilt = it.landed ? 0.0 : Math.sin(it.t * 4 + it.id) * 0.35, ct = Math.cos(tilt), st = Math.sin(tilt);
    // R = Ry(yaw) * Rx(tilt)
    return new Float32Array([cy * s, 0, -sy * s, 0, sy * st * s, ct * s, cy * st * s, 0, sy * ct * s, -st * s, cy * ct * s, 0,
      it.pos[0], it.pos[1], it.pos[2], 1]);
  }
}


/* ---------- 7. Material & fur system ----------------------------------- */
const MATERIAL_TYPES = { plush: 0, felt: 1, glass: 2, embroidery: 3, stitch: 4 };
const MATERIAL_DEFAULTS = {
  plush: { fur: 1, sheen: 0.6, gloss: 0 },
  felt: { fur: 0, sheen: 0.3, gloss: 0 },
  glass: { fur: 0, sheen: 0, gloss: 1 },
  embroidery: { fur: 0, sheen: 0.15, gloss: 0.45 },
  stitch: { fur: 0, sheen: 0.1, gloss: 0.3 },
};
const MAX_REGIONS = 16, MAX_DECALS = 128, MAX_GROUPS = 32, MAX_ATTACH = 4, MAX_SPOTS = 4;

/** Region table (16 × 8 floats) for a fabric preset: colour, type, fur multiplier, sheen, gloss. */
function buildMaterialTable(def, presetId) {
  const regions = def.materials.regions, names = Object.keys(regions);
  const preset = def.materials.presets.find((p) => p.id === presetId) || def.materials.presets[0];
  const out = new Float32Array(MAX_REGIONS * 8);
  names.forEach((name, i) => {
    const r = regions[name], base = MATERIAL_DEFAULTS[r.type];
    const col = hexToLinear(preset.colors[name] || '#ff00ff');
    out.set([col[0], col[1], col[2], MATERIAL_TYPES[r.type], r.fur ?? base.fur, r.sheen ?? base.sheen, r.gloss ?? base.gloss, 0], i * 8);
  });
  return out;
}

/* ---------- 8. Asset building: anatomy → meshes, lattice, embeddings ---- */
/**
 * Converts a species' procedural anatomy into GPU-ready geometry (separate
 * from simulation state, so it can be cached and re-used across resets).
 */
function buildCreatureAssets(def) {
  const A = def.anatomy, t0 = performance.now();
  const regionNames = Object.keys(def.materials.regions);
  const regionIndex = (name) => {
    const i = regionNames.indexOf(name);
    if (i < 0) throw new Error(`Region "${name}" is not declared in materials.regions`);
    return i;
  };
  const parts = A.parts.map((part) => {
    const mesh = surfaceNets(part.sdf, part.bounds.min, part.bounds.max, part.resolution);
    const P = mesh.positions, nv = P.length / 3, r0 = new Uint32Array(nv);
    // Output vertices reference a mesh vertex (src) and carry a region pair + signed boundary field.
    const src = [], reg = [], field = [], I = Array.from(mesh.indices);
    for (let v = 0; v < nv; v++) { r0[v] = regionIndex(part.region(P[3 * v], P[3 * v + 1], P[3 * v + 2])); src.push(v); reg.push(r0[v] | (r0[v] << 8)); field.push(1); }
    // Triangles straddling a species boundary get private vertex copies holding that boundary's
    // field, so the fragment shader can resolve the seam exactly inside the triangle.
    const bds = part.boundaries || [], pick = (r, x, y, z) => regionIndex(typeof r === 'function' ? r(x, y, z) : r);
    if (bds.length) for (let t = 0; t < I.length; t += 3) {
      const ia = I[t], ib = I[t + 1], ic = I[t + 2];
      const cx = (P[3 * ia] + P[3 * ib] + P[3 * ic]) / 3, cy = (P[3 * ia + 1] + P[3 * ib + 1] + P[3 * ic + 1]) / 3, cz = (P[3 * ia + 2] + P[3 * ib + 2] + P[3 * ic + 2]) / 3;
      let best = null, score = 1;
      for (const bd of bds) {
        if (bd.where && !bd.where(cx, cy, cz)) continue;
        const sc = Math.abs(bd.field(cx, cy, cz)) / (bd.band ?? 0.05);
        if (sc < score) { score = sc; best = bd; }
      }

/* ---------- 9. Interaction tools (species-agnostic) -------------------- */
/**
 * Tools only know how to apply generic physical effects and emit generic
 * events (grab / release / poke / stroke / comb). What a creature *does* about
 * an event is decided by the species' reaction rules.

const TOOLS = {
  hand: {
    label: 'Hand', glyph: '✋', requires: null,
    hint: 'Drag the plush to grab and move it. Drag empty space to orbit.',
    begin(c, hit, ray) {
      if (!c.sim.startGrab(hit.point, c.sim.lat.H * 1.7)) return false;
      this.plane = { p: hit.point.slice(), n: v3.scale(ray.view, -1) };
      c.interaction.grabbed = true; c.interaction.regions = hit.regions; c.interaction.point = hit.point;
      c.emit('grab', { regions: hit.regions, point: hit.point });
      return true;
    },
    move(c, hit, ray) {
      const { p, n } = this.plane, den = v3.dot(ray.d, n);

    end(c) {
      c.sim.grab = null; c.interaction.grabbed = false;

    },
  },
  finger: {
    label: 'Finger', glyph: '☝', requires: null,
    hint: 'Tap to poke or boop. Drag across the plush to pet it.',
    begin(c, hit, ray) {
      c.poke(hit.point, ray.d, 1.6, c.sim.lat.H * 2.2);

      this.last = 0;
      return true;
    },
    move(c, hit, ray) {
      if (!hit || c.time - this.last < 0.12) return;
      this.last = c.time;
      c.poke(hit.point, ray.d, 0.35, c.sim.lat.H * 2);
      c.emit('stroke', { regions: hit.regions, point: hit.point });
    },
    end() {},
  },
  comb: {
    label: 'Comb', glyph: '≋', requires: 'fur',
    hint: 'Drag across the pile to brush it. Smooth fur resets the nap.',
    begin(c, hit) { this.prev = hit ? hit.point : null; this.last = -1; return true; },
    move(c, hit) {

    end() { this.prev = null; },

};

        const d = Math.hypot(A.restPos[3 * v] - p[0], A.restPos[3 * v + 1] - p[1], A.restPos[3 * v + 2] - p[2]);
        if (d > rad || A.furDir[3 * v] === 0 && A.furDir[3 * v + 1] === 0 && A.furDir[3 * v + 2] === 0) continue;
        const nx = A.restNrm[3 * v], ny = A.restNrm[3 * v + 1], nz = A.restNrm[3 * v + 2], dn = dr[0] * nx + dr[1] * ny + dr[2] * nz;
        const t = v3.norm([dr[0] - nx * dn, dr[1] - ny * dn, dr[2] - nz * dn]), wgt = strength * (1 - d / rad);
        const m = v3.norm([comb[3 * v] * (1 - wgt) + t[0] * wgt, comb[3 * v + 1] * (1 - wgt) + t[1] * wgt, comb[3 * v + 2] * (1 - wgt) + t[2] * wgt]);
        comb.set(m, 3 * v);
      }
    }
    this.fur.dirty = true;
  }
  smoothFur() { if (this.fur) { this.fur.comb.set(this.assets.furDir); this.fur.dirty = true; } }
  /** Grain alignment of the comb field (1 = smooth nap) — a live read-out. */
  napAlignment() {
    if (!this.fur) return 1;
    const c = this.fur.comb, f = this.assets.furDir;
    let s = 0, n = 0;
    for (let i = 0; i < c.length; i += 9) { const d = c[i] * f[i] + c[i + 1] * f[i + 1] + c[i + 2] * f[i + 2]; if (f[i] || f[i + 1] || f[i + 2]) { s += d; n++; } }
    return n ? s / n : 1;
  }
  updateMetrics() {
    const u = this.def.physics.unitMeters, V = this.sim.measureVolume() * u ** 3 * 1000; // litres
    this.metrics.volume = V;
    this.metrics.mass = V * this.def.physics.fillGramsPerLitre * this.sim.stuffing + this.def.physics.shellGrams;
  }
  reset() {
    this.rng = makeRng(this.seed); this.env.rng = this.rng; this.env.clear();
    this.sim.reset(this.spawnTransform()); this.loco.reset();
    this.joints.forEach((j) => { j.angle = 0; j.vel = 0; });
    this.expr.fill(0); this.lag.fill(0); this.lagV.fill(0);
    Object.keys(this.state).forEach((k) => delete this.state[k]);
    if (this.def.createState) Object.assign(this.state, this.def.createState());
    this.interaction.grabbed = false; this.time = 0; this.ctx.time = 0;
    this.machine.reset();
    this.smoothFur();
  }
}

/* ---------- 11. Species registry & validation -------------------------- */
const registry = [];
const BEHAVIOR_KINDS = ['autonomous', 'user', 'reactive', 'environment'];
const CONTROL_TYPES = ['button', 'toggle', 'slider', 'select', 'preset'];
const BIND_NAMESPACES = ['physics', 'fur', 'locomotion', 'flags', 'material'];

/**
 * Static validation of a SpeciesDefinition against engine capabilities. It
 * deliberately knows nothing about any animal; it checks references only.
 */
function validateSpecies(def) {
  const errors = [], warnings = [];
  let checks = 0;
  const req = (cond, msg) => { checks++; if (!cond) errors.push(msg); };
  req(def.id && def.name && def.category, 'identity: id, name and category are required');
  if (def.status === 'planned') return { ok: errors.length === 0, errors, warnings, checks, planned: true };
  req(def.display && Array.isArray(def.display.title) && def.display.title.length === 2, 'display.title must be two lines');
  req(ENVIRONMENTS[def.environment?.preset], `environment preset "${def.environment?.preset}" is not registered`);
  const A = def.anatomy || {};
  req(Array.isArray(A.parts) && A.parts.length, 'anatomy.parts must be non-empty');
  req((A.parts || []).some((p) => !p.attach), 'anatomy needs at least one lattice-skinned part');
  const regions = Object.keys(def.materials?.regions || {});
  req(regions.length > 0 && regions.length <= MAX_REGIONS, `materials.regions must declare 1–${MAX_REGIONS} regions`);
  for (const r of regions) req(MATERIAL_TYPES[def.materials.regions[r].type] !== undefined, `region "${r}" has unknown material type`);
  for (const p of A.parts || []) {
    req(typeof p.sdf === 'function' && typeof p.region === 'function', `part "${p.id}": sdf() and region() required`);
    req(p.bounds && p.resolution > 0, `part "${p.id}": bounds and resolution required`);
    if (p.attach) {
      req(A.anchors && A.anchors[p.attach.anchor], `part "${p.id}": anchor "${p.attach.anchor}" missing`);
      if (p.attach.joint) req(A.joints && A.joints[p.attach.joint], `part "${p.id}": joint "${p.attach.joint}" missing`);
    }
  }
  for (const [id, j] of Object.entries(A.joints || {})) req(j.axis && j.stiffness > 0 && j.damping >= 0, `joint "${id}": axis/stiffness/damping`);
  for (const s of A.expressions?.spots || []) req((A.expressions.channels || []).includes(s.channel), `expression spot uses unknown channel "${s.channel}"`);
  req((A.expressions?.channels || []).length <= 4, 'at most 4 expression channels');
  for (const p of def.materials?.presets || []) for (const r of regions) req(p.colors[r], `preset "${p.id}" lacks colour for region "${r}"`);
  req(def.materials?.presets?.some((p) => p.id === def.materials.defaultPreset), 'materials.defaultPreset must exist');
  const P = def.physics || {};
  req(P.latticeSpacing > 0 && Array.isArray(P.shapeStiffness) && Array.isArray(P.volumeCompliance) && Array.isArray(P.inflate), 'physics: latticeSpacing, shapeStiffness, volumeCompliance, inflate');
  req(P.unitMeters > 0 && P.fillGramsPerLitre > 0, 'physics: unitMeters and fillGramsPerLitre for read-outs');
  req(Locomotion.registry[def.locomotion?.type], `locomotion "${def.locomotion?.type}" is not a registered capability`);
  const B = def.behaviors || {}, states = B.states || {};
  req(states[B.initial], `initial behaviour "${B.initial}" missing`);
  for (const [id, s] of Object.entries(states)) {
    req(BEHAVIOR_KINDS.includes(s.kind), `behaviour "${id}": kind must be one of ${BEHAVIOR_KINDS.join(', ')}`);
    req(typeof s.priority === 'number', `behaviour "${id}": numeric priority`);
  }
  const I = def.interactions || {}, regionIds = (I.regions || []).map((r) => r.id);
  for (const t of I.tools || []) {
    req(TOOLS[t], `tool "${t}" is not provided by the engine`);
    if (TOOLS[t]?.requires === 'fur') req(!!def.fur, `tool "${t}" requires a fur definition`);
  }
  for (const r of I.reactions || []) {
    req(states[r.behavior], `reaction on "${r.on}" targets unknown behaviour "${r.behavior}"`);
    if (r.region) req(regionIds.includes(r.region), `reaction references unknown region "${r.region}"`);
  }
  if (def.fur) req(typeof def.fur.direction === 'function' && def.fur.shells > 0, 'fur: direction() and shells');
  for (const c of def.controls || []) {
    req(c.id && c.label && CONTROL_TYPES.includes(c.type), `control "${c.id}": id, label and supported type`);
    if (c.action) req((def.actions && def.actions[c.action]) || ENGINE_ACTIONS[c.action], `control "${c.id}": unknown action "${c.action}"`);
    if (ENGINE_ACTIONS[c.action]?.requires === 'fur') req(!!def.fur, `control "${c.id}" needs fur`);
    if (c.bind) req(BIND_NAMESPACES.includes(c.bind.split('.')[0]), `control "${c.id}": bind namespace must be one of ${BIND_NAMESPACES.join(', ')}`);
    if (c.type === 'slider') req(c.min < c.max && c.default >= c.min && c.default <= c.max, `slider "${c.id}": range/default`);
    if (c.bind === 'fur.pile') req(!!def.fur, `slider "${c.id}" binds fur but species has none`);
  }
  for (const r of def.readouts || []) req(r.id && r.label && typeof r.get === 'function', `readout "${r.id}": label and get()`);
  for (const [id, it] of Object.entries(def.items || {})) req(typeof it.sdf === 'function' && it.radius > 0, `item "${id}": sdf and radius`);
  if (!def.notes) warnings.push('no technical notes');
  return { ok: errors.length === 0, errors, warnings, checks };
}

function registerSpecies(def) {
  def.validation = validateSpecies(def);
  registry.push(def);
  if (!def.validation.ok) console.warn(`Species "${def.id}" failed validation`, def.validation.errors);
  return def;
}


/* ---------- 12. Rendering system (WebGPU) ------------------------------ */
const WGSL = /* wgsl */`
struct Frame {
  viewProj: mat4x4f, lightViewProj: mat4x4f,
  eye: vec4f, keyDir: vec4f, keyColor: vec4f, fillDir: vec4f, fillColor: vec4f,
  skyColor: vec4f, groundColor: vec4f, bgColor: vec4f,
  fur: vec4f,      // pile length, shell count, strand density, droop
  env: vec4f,      // floor y, caustics, fade radius, unused
  bounds: vec4f,   // min x, min z, max x, max z
  floorColor: vec4f,
};
struct Material { color: vec4f, props: vec4f };
struct Spot { center: vec4f, color: vec4f };
struct Decal { a: vec4f, b: vec4f, p: vec4f };
struct CreatureU {
  attach: array<mat4x4f, 4>,
  materials: array<Material, 16>,
  spots: array<Spot, 4>,
  expr: vec4f,
  groups: array<vec4u, 32>,
  decals: array<Decal, 128>,
};
struct Props { model: array<mat4x4f, 8> };

@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var<storage, read> particles: array<vec4f>;
@group(0) @binding(2) var<storage, read> lagBuf: array<vec4f>;
@group(0) @binding(3) var<storage, read> cells: array<u32>;
@group(0) @binding(4) var<uniform> C: CreatureU;
@group(0) @binding(5) var<uniform> P: Props;
@group(1) @binding(0) var shadowTex: texture_depth_2d;
@group(1) @binding(1) var shadowSamp: sampler_comparison;

struct VIn {
  @location(0) restPos: vec3f,
  @location(1) restNrm: vec3f,
  @location(2) uvw: vec3f,
  @location(3) info: vec4u,     // lattice cell, attachment, region pair (lo: +side, hi: -side), decal-group mask
  @location(4) furDir: vec4f,   // xyz: default nap direction, w: signed region-boundary field
  @location(5) comb: vec3f,
};
struct VOut {
  @builtin(position) pos: vec4f,
  @location(0) world: vec3f,
  @location(1) nrm: vec3f,
  @location(2) rest: vec3f,
  @location(3) @interpolate(flat) info: vec2u,
  @location(4) shell: f32,
  @location(5) grain: f32,
  @location(6) restN: vec3f,
  @location(7) field: f32,
};
struct Skinned { pos: vec3f, nrm: vec3f, comb: vec3f, lag: vec3f };

fn skin(v: VIn) -> Skinned {
  var s: Skinned;
  if (v.info.y > 0u) {
    let M = C.attach[v.info.y - 1u];
    s.pos = (M * vec4f(v.restPos, 1.0)).xyz;
    s.nrm = (M * vec4f(v.restNrm, 0.0)).xyz;
    s.comb = (M * vec4f(v.comb, 0.0)).xyz;
    s.lag = vec3f(0.0);
    return s;
  }
  let b = v.info.x * 8u;
  let x0 = particles[cells[b]].xyz;      let x1 = particles[cells[b + 1u]].xyz;
  let x2 = particles[cells[b + 2u]].xyz; let x3 = particles[cells[b + 3u]].xyz;
  let x4 = particles[cells[b + 4u]].xyz; let x5 = particles[cells[b + 5u]].xyz;
  let x6 = particles[cells[b + 6u]].xyz; let x7 = particles[cells[b + 7u]].xyz;
  let u = v.uvw.x; let w = v.uvw.z; let t = v.uvw.y;
  s.pos = mix(mix(mix(x0, x1, u), mix(x2, x3, u), t), mix(mix(x4, x5, u), mix(x6, x7, u), t), w);
  let du = (1.0 - t) * (1.0 - w) * (x1 - x0) + t * (1.0 - w) * (x3 - x2) + (1.0 - t) * w * (x5 - x4) + t * w * (x7 - x6);
  let dv = (1.0 - u) * (1.0 - w) * (x2 - x0) + u * (1.0 - w) * (x3 - x1) + (1.0 - u) * w * (x6 - x4) + u * w * (x7 - x5);
  let dw = (1.0 - u) * (1.0 - t) * (x4 - x0) + u * (1.0 - t) * (x5 - x1) + (1.0 - u) * t * (x6 - x2) + u * t * (x7 - x3);
  s.nrm = v.restNrm.x * cross(dv, dw) + v.restNrm.y * cross(dw, du) + v.restNrm.z * cross(du, dv);
  s.comb = du * v.comb.x + dv * v.comb.y + dw * v.comb.z;
  let l0 = lagBuf[cells[b]].xyz;      let l1 = lagBuf[cells[b + 1u]].xyz;
  let l2 = lagBuf[cells[b + 2u]].xyz; let l3 = lagBuf[cells[b + 3u]].xyz;
  let l4 = lagBuf[cells[b + 4u]].xyz; let l5 = lagBuf[cells[b + 5u]].xyz;
  let l6 = lagBuf[cells[b + 6u]].xyz; let l7 = lagBuf[cells[b + 7u]].xyz;
  s.lag = mix(mix(mix(l0, l1, u), mix(l2, l3, u), t), mix(mix(l4, l5, u), mix(l6, l7, u), t), w);
  return s;
}

fn safeNorm(v: vec3f, fallback: vec3f) -> vec3f {
  let l = length(v);
  if (l < 1e-8) { return fallback; }
  return v / l;
}

@vertex fn vsCreature(v: VIn, @builtin(instance_index) inst: u32) -> VOut {
  let s = skin(v);
  let n = safeNorm(s.nrm, vec3f(0.0, 1.0, 0.0));
  let mat = C.materials[select(v.info.z >> 8u, v.info.z & 255u, v.furDir.w >= 0.0)];
  let t = f32(inst) / max(F.fur.y, 1.0);
  var len = F.fur.x * mat.props.x;
  if (v.info.w != 0u && inst > 0u) { len *= decalPileScale(v.restPos, v.info.w); }
  var comb = s.comb - n * dot(s.comb, n);
  comb = safeNorm(comb, vec3f(0.0));
  let bend = comb * 0.6 + s.lag + vec3f(0.0, -F.fur.w, 0.0);
  let p = s.pos + n * (len * t) + bend * (len * t * t);
  var o: VOut;
  o.pos = F.viewProj * vec4f(p, 1.0);
  o.world = p;
  o.nrm = safeNorm(n + bend * t * 0.35, n);
  o.rest = v.restPos;
  o.info = vec2u(v.info.z, v.info.w);
  o.shell = t;
  o.grain = dot(safeNorm(v.comb, vec3f(0.0)), safeNorm(v.furDir.xyz, vec3f(0.0)));
  if (length(v.furDir.xyz) < 0.5) { o.grain = 1.0; }
  o.restN = v.restNrm;
  o.field = v.furDir.w;
  return o;
}

@vertex fn vsShadow(v: VIn) -> @builtin(position) vec4f {
  return F.lightViewProj * vec4f(skin(v).pos, 1.0);
}

fn pcg(v: u32) -> u32 {
  let s = v * 747796405u + 2891336453u;
  let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
fn hash3(c: vec3f) -> vec3f {
  let i = vec3u(vec3i(c) + vec3i(8192));
  let a = pcg(i.x ^ pcg(i.y ^ pcg(i.z)));
  return vec3f(f32(a & 1023u), f32((a >> 10u) & 1023u), f32((a >> 20u) & 1023u)) / 1023.0;
}

fn encode(c: vec3f) -> vec3f { return pow(clamp(c, vec3f(0.0), vec3f(1.0)), vec3f(1.0 / 2.2)); }

fn shadowAt(world: vec3f, n: vec3f) -> f32 {
  let lp = F.lightViewProj * vec4f(world + n * 0.015, 1.0);
  let uv = vec2f(lp.x * 0.5 + 0.5, 0.5 - lp.y * 0.5);
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0 || lp.z > 1.0) { return 1.0; }
  let texel = 1.0 / 2048.0;
  var sum = 0.0;
  for (var y = -1; y <= 1; y++) {
    for (var x = -1; x <= 1; x++) {
      sum += textureSampleCompareLevel(shadowTex, shadowSamp, uv + vec2f(f32(x), f32(y)) * texel * 1.6, lp.z - 0.0015);
    }
  }
  return mix(1.0, sum / 9.0, F.keyDir.w);
}

fn studioEnv(r: vec3f) -> vec3f {
  var c = mix(F.groundColor.rgb * 0.6, F.skyColor.rgb * 1.15, smoothstep(-0.3, 0.8, r.y));
  c += F.keyColor.rgb * pow(max(dot(r, normalize(F.keyDir.xyz)), 0.0), 60.0) * 3.0;
  c += F.fillColor.rgb * pow(max(dot(r, normalize(F.fillDir.xyz)), 0.0), 16.0) * 0.6;
  return c;
}

struct Surf { color: vec3f, kind: f32, furMul: f32, sheen: f32, gloss: f32, cut: f32 };

// x: hit, y: region, z: distance along stitch line, w: cuts fur
fn decalAt(p: vec3f, mask: u32) -> vec4f {
  var res = vec4f(0.0);
  var m = mask;
  for (var guard = 0; guard < 32; guard++) {
    if (m == 0u) { break; }
    let g = firstTrailingBit(m);
    m = m & (m - 1u);
    let gr = C.groups[g];
    for (var k = gr.x; k < gr.x + gr.y; k++) {
      let d = C.decals[k];
      let ab = d.b.xyz - d.a.xyz;
      let L = max(length(ab), 1e-6);
      let h = clamp(dot(p - d.a.xyz, ab) / (L * L), 0.0, 1.0);
      let dist = length(p - d.a.xyz - ab * h);
      if (dist < d.a.w) {
        let along = h * L + d.p.w;
        var on = true;
        if (d.p.x > 0.0) { on = fract(along / d.p.x) < d.p.y; }
        if (on) { res = vec4f(1.0, d.b.w, along, d.p.z); }
      }
    }
  }
  return res;
}

// Embroidery and stitches pull the pile down around them (quilted groove).
fn decalPileScale(p: vec3f, mask: u32) -> f32 {
  var k = 1.0;
  var m = mask;
  for (var guard = 0; guard < 32; guard++) {
    if (m == 0u) { break; }
    let g = firstTrailingBit(m);
    m = m & (m - 1u);
    let gr = C.groups[g];
    for (var i = gr.x; i < gr.x + gr.y; i++) {
      let d = C.decals[i];
      if (d.p.z < 0.5) { continue; }
      let ab = d.b.xyz - d.a.xyz;
      let h = clamp(dot(p - d.a.xyz, ab) / max(dot(ab, ab), 1e-10), 0.0, 1.0);
      let dist = length(p - d.a.xyz - ab * h);
      k = min(k, mix(0.15, 1.0, smoothstep(d.a.w * 0.5, d.a.w + 0.02, dist)));
    }
  }
  return k;
}

fn surfaceAt(rest: vec3f, regions: u32, field: f32, mask: u32) -> Surf {
  var s: Surf;
  var region = select(regions >> 8u, regions & 255u, field >= 0.0);
  let dh = decalAt(rest, mask);
  s.cut = 0.0;
  if (dh.x > 0.5) { region = u32(dh.y); s.cut = dh.w; }
  let m = C.materials[region];
  s.color = m.color.rgb; s.kind = m.color.a; s.furMul = m.props.x; s.sheen = m.props.y; s.gloss = m.props.z;
  if (dh.x > 0.5 && s.kind > 2.5 && s.kind < 3.5) { s.color *= 0.8 + 0.2 * sin(dh.z * 1800.0); }
  if (s.kind < 1.5) {
    for (var i = 0; i < 4; i++) {
      let sp = C.spots[i];
      if (sp.center.w <= 0.0) { continue; }
      let amt = C.expr[u32(sp.color.w)] * (1.0 - smoothstep(sp.center.w * 0.3, sp.center.w, distance(rest, sp.center.xyz)));
      s.color = mix(s.color, sp.color.rgb, clamp(amt, 0.0, 1.0) * 0.8);
    }
  }
  return s;
}

fn shade(s: Surf, world: vec3f, n: vec3f, ao: f32, grain: f32) -> vec3f {
  let v = normalize(F.eye.xyz - world);
  let l = normalize(F.keyDir.xyz);
  let sh = shadowAt(world, n);
  let ndl = dot(n, l);
  let ndv = clamp(dot(n, v), 0.0, 1.0);
  let hemi = mix(F.groundColor.rgb, F.skyColor.rgb, n.y * 0.5 + 0.5);
  if (s.kind > 1.5 && s.kind < 2.5) {           // glass eye
    let r = reflect(-v, n);
    let fres = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);
    let h = normalize(l + v);
    let spec = pow(max(dot(n, h), 0.0), 260.0) * 7.0 * sh;
    return s.color * (0.25 + 0.6 * max(ndl, 0.0) * sh) + studioEnv(r) * (0.06 + fres * 0.75) + F.keyColor.rgb * spec;
  }
  var base = s.color;
  if (s.kind < 0.5) { base *= mix(0.74, 1.04, grain * 0.5 + 0.5); }   // minky nap: against-grain reads darker
  let wrap = clamp((ndl + 0.45) / 1.45, 0.0, 1.0);
  let key = F.keyColor.rgb * wrap * mix(0.35, 1.0, sh);
  let fill = F.fillColor.rgb * clamp(dot(n, normalize(F.fillDir.xyz)) * 0.5 + 0.5, 0.0, 1.0);
  var col = base * (key + fill + hemi * ao);
  let rim = pow(1.0 - ndv, 2.5) * s.sheen;
  col += rim * (hemi * 0.5 + F.keyColor.rgb * 0.25 * sh) * (base * 1.4 + vec3f(0.12));
  if (s.gloss > 0.0) {
    let h = normalize(l + v);
    col += F.keyColor.rgb * pow(max(dot(n, h), 0.0), 36.0) * s.gloss * sh * 0.5;
  }
  return col;
}

fn fog(c: vec3f, world: vec3f) -> vec3f {
  let d = distance(world, F.eye.xyz);
  return mix(c, F.bgColor.rgb, smoothstep(9.0, 26.0, d) * 0.7);
}

@fragment fn fsCreature(in: VOut) -> @location(0) vec4f {
  let s = surfaceAt(in.rest, in.info.x, in.field, in.info.y);
  let n = normalize(in.nrm);
  let furred = s.furMul > 0.0 && F.fur.y > 0.0 && s.cut < 0.5;
  var ao = 1.0;
  if (furred) { ao = 0.6; }
  var col = shade(s, in.world, n, ao, in.grain);
  if (furred) { col *= 0.66; }
  return vec4f(encode(fog(col, in.world)), 1.0);
}

@fragment fn fsFur(in: VOut) -> @location(0) vec4f {
  let s = surfaceAt(in.rest, in.info.x, in.field, in.info.y);
  let t = in.shell;
  let q = in.rest * F.fur.z;
  let h1 = hash3(floor(q));
  let f = fract(q) - 0.5 - (h1 - 0.5) * 0.45;
  let rn = normalize(in.restN);

struct FOut { @builtin(position) pos: vec4f, @location(0) world: vec3f };

// ---- props (environment items) ------------------------------------------
struct PIn { @location(0) pos: vec3f, @location(1) nrm: vec3f, @location(2) col: vec3f };
struct POut { @builtin(position) pos: vec4f, @location(0) world: vec3f, @location(1) nrm: vec3f, @location(2) col: vec3f };

// ---- lattice debug lines -------------------------------------------------
@vertex fn vsLines(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
  return F.viewProj * vec4f(particles[vi].xyz, 1.0);
